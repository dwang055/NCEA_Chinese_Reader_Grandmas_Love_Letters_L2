<html lang="en">
<head>

<title>91108 practice — Family stories — mock listening paper</title>
<style>
:root{--bg:#f4f2ee;--paper:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#dedad3;--accent:#9b2d20;--on-accent:#fff;--accent-soft:#f6e9e6;--chip:#efece6;--me:#e3efe9;--them:#f1efea;--focus:#2d6cdf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--paper:#1f1f20;--ink:#ececec;--muted:#a3a3a8;--line:#353537;--accent:#e2735f;--on-accent:#1a0d0a;--accent-soft:#3a2420;--chip:#2a2a2c;--me:#22332b;--them:#2a2a2c;--focus:#7aa7ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--paper:#1f1f20;--ink:#ececec;--muted:#a3a3a8;--line:#353537;--accent:#e2735f;--on-accent:#1a0d0a;--accent-soft:#3a2420;--chip:#2a2a2c;--me:#22332b;--them:#2a2a2c;--focus:#7aa7ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.zh,.zh *{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.std{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.std .num{font-weight:700;color:var(--accent);font-size:1.05rem;letter-spacing:.04em}
.std h1{font-size:1.25rem;margin:0;font-weight:650}
.meta{color:var(--muted);font-size:.92rem;margin-top:4px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.grades div{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.84rem}
.grades b{display:block;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.instr{font-size:.92rem;margin:10px 0 0;padding-left:18px}
.instr li{margin:2px 0}
section.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:18px 0;overflow:hidden}
.qhead{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.qhead h2{margin:0;font-size:1.05rem}
.qhead .tag{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.cols>div{padding:18px 22px}
.res{border-right:1px solid var(--line);background:linear-gradient(var(--paper),var(--paper))}
.res .inner{position:sticky;top:12px}
.intro{color:var(--muted);font-size:.93rem;margin:0 0 12px}
.text{font-size:1.14rem;line-height:1.95}
.text p{margin:0 0 .7em}
.text h4{margin:.6em 0 .3em;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:8px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .ct{font-weight:700;margin-bottom:4px;color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--them)}
.msg.right{align-self:flex-end;background:var(--me)}
.msg .who{font-size:.78rem;color:var(--muted);display:block}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.email .eh{background:var(--chip);padding:8px 14px;font-size:.9rem}
.email .eb{padding:12px 14px}
.post{border-left:3px solid var(--line);padding:4px 12px;margin:10px 0}
.post.reply{margin-left:22px}
.post .who{font-weight:650;font-size:.95rem}.post .when{color:var(--muted);font-size:.8rem;margin-left:6px}
.imgnote{border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--muted);font-size:.85rem;margin:8px 0}
.gloss{margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.gloss h5{margin:0 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gloss table{border-collapse:collapse;font-size:.95rem}
.gloss td{padding:2px 14px 2px 0}
.qs .part{margin:0 0 18px}
.qs .part p{margin:0 0 6px}
.qs .part b{color:var(--accent);margin-right:4px}
textarea{width:100%;min-height:130px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.notes textarea{min-height:110px;background:var(--chip)}
.player{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
button.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.left{font-size:.8rem;color:var(--muted)}
.now{font-size:.85rem;color:var(--accent);min-height:1.2em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:.9rem;z-index:5}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.bar button{padding:6px 12px;font-size:.88rem}
@media (max-width:640px){.bar{gap:6px}.bar .long{display:none}}
.copybox{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--accent);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6;display:flex;flex-direction:column;gap:8px}
.copybox textarea{min-height:180px;font-size:.85rem}
.saved{color:var(--muted);font-size:.8rem}
@media (max-width:820px){.cols{grid-template-columns:1fr}.res{border-right:0;border-bottom:1px solid var(--line)}.res .inner{position:static}.grades{grid-template-columns:1fr}}
@media print{.bar,.player,button{display:none!important}body{background:#fff}section.q{break-inside:avoid-page;border-color:#999}.res .inner{position:static}textarea{border:1px solid #999;min-height:160px}}
</style>
</head>

<script>
const P = {"standard": "91108", "title": "Family stories — mock listening paper", "id": "91108-L2-grandmas-letters", "genders": {"主持人": "M", "王奶奶": "F", "小月": "F", "大明": "M", "Hana": "F"}, "items": [{"title_zh": "奶奶的信", "title_en": "Grandma's letters", "type": "Interview", "intro": "Listen to a radio interview with Wang Nainai about the letters she and her husband wrote to each other. Refer to the passage in your answer to Question One.", "allow": ["王奶奶", "澳大利亚"], "glosses": [{"zh": "信", "py": "xìn", "en": "letter"}, {"zh": "盒子", "py": "hézi", "en": "box"}, {"zh": "孙女", "py": "sūnnǚ", "en": "granddaughter"}, {"zh": "一辈子", "py": "yíbèizi", "en": "a lifetime"}, {"zh": "叶子", "py": "yèzi", "en": "leaf"}], "sections": [[["主持人", "王奶奶，听说您和爷爷年轻的时候写了很多信，是真的吗？"], ["王奶奶", "是真的。我们刚在一起没多久，他就去澳大利亚工作了，因为那里的工作钱多一点。那时候打电话太贵了，一分钟要好几块钱，所以我们每个星期都写一封信。"], ["主持人", "您还记得第一封信吗？"]], [["王奶奶", "当然记得！那封信是在飞机上写的。他写得很短，只有五六行字，可是信的最后有一张小画。"], ["主持人", "为什么画画？"], ["王奶奶", "因为他说，他的中文写得不好，可是画画可以告诉我他每天怎么样。高兴的时候，他画一只鸟；想家的时候，他画一棵树，树下有两个人。五年里，我们差不多写了三百封信。"], ["主持人", "那您也给他画画吗？"], ["王奶奶", "我不会画画，所以我在信里放一个花园里的叶子。他说，看到叶子，就知道家里是什么季节了。"]], [["主持人", "这些信现在在哪儿？"], ["王奶奶", "都在一个红色的盒子里，放在我的房间里。去年，我的孙女把每一封信都照了下来，放在电脑里。她说，以后她的孩子也可以看。"], ["王奶奶", "现在年轻人发短信很快，可是一封自己写的信，你可以看一辈子。我每次想爷爷的时候，就打开盒子，看看那些小鸟和小树。"]]], "questions": [{"part": "a", "text": "Why did Wang Nainai and her husband write letters, and what was special about his letters?", "lines": 8}, {"part": "b", "text": "Why are the letters important to Wang Nainai and her family today? Use evidence.", "lines": 10}], "schedule": {"evidence": [{"band": "A", "heading": "Why letters", "points": ["Soon after they got together he went to work in Australia, where pay was higher.", "Phone calls were too expensive (several dollars a minute) — they wrote a letter every week.", "She couldn’t draw, so she put a leaf from the garden in her letters — he could tell the season at home."]}, {"band": "M", "heading": "His letters", "points": ["About 300 letters in five years.", "First letter only 5–6 lines, with a small drawing at the end; a bird when happy, a tree with two people under it when homesick.", "His Chinese writing wasn’t good; drawings showed his feelings."]}, {"band": "E", "heading": "Importance today", "points": ["Kept in a red box by her bed; granddaughter photographed them and saved them on the computer for her future children.", "Wang Nainai contrasts quick text messages with handwritten letters you keep for life.", "She opens the box whenever she misses grandpa — letters keep their love alive and connect generations."]}], "A": "Identifies some reasons for the letters or details about them.", "M": "Clearly explains why they wrote and what made his letters special, with evidence.", "E": "Thoroughly explains why the letters still matter — preserved by the granddaughter for the next generation — and Wang Nainai’s view that handwritten letters last a lifetime.", "model": "The letters matter because they keep the couple’s story alive for the whole family. Soon after they got together, her husband went to work in Australia and phone calls were too expensive, so they wrote every week — about 300 letters in five years. His letters were short, but each had a small drawing — a bird when he was happy, a tree with two people when he missed home — because he felt his Chinese writing was poor and pictures showed his feelings. Today they are kept in a red box, and her granddaughter has photographed them so her own children can read them. Wang Nainai says text messages are fast, but a handwritten letter can be read for a lifetime, and she still opens the box when she misses him."}, "id": "1"}, {"title_zh": "爷爷奶奶的纪念日", "title_en": "Grandparents' anniversary", "type": "Conversation", "intro": "Listen to two cousins, Xiaoyue and Daming, planning a surprise for their grandparents. Refer to the passage in your answer to Question Two.", "allow": ["小月", "大明", "李奶奶"], "glosses": [{"zh": "纪念日", "py": "jìniànrì", "en": "anniversary"}, {"zh": "吵", "py": "chǎo", "en": "noisy"}, {"zh": "耳朵", "py": "ěrduo", "en": "ear"}, {"zh": "惊喜", "py": "jīngxǐ", "en": "surprise"}, {"zh": "踩", "py": "cǎi", "en": "to step on (someone’s foot)"}], "sections": [[["小月", "大明，下个月是爷爷奶奶在一起五十年的纪念日。我们给他们做点什么吧！"], ["大明", "好啊！我们请全家人去饭馆吃饭，怎么样？我知道市中心有一家很有名的中国饭馆。"], ["小月", "我觉得不太好。"]], [["小月", "饭馆太吵了，爷爷的耳朵不好，去年在饭馆，他什么都听不到，一直不说话，很不开心。我想在家里做饭，再做一本照片书，放他们年轻时候的照片。"], ["大明", "照片书很好！可是我们要先找到他们以前的照片，得问我妈妈，她有一个很大的照片本。"], ["小月", "我妈妈也有一些。我们这个周末一起去找吧。"]], [["大明", "那做什么菜呢？奶奶最喜欢吃鱼。"], ["小月", "我们可以请奶奶的好朋友李奶奶教我们做奶奶家乡的鱼。她们是在一个地方长大的。"], ["大明", "太好了！可是千万别告诉奶奶，我们要给她一个惊喜。"], ["小月", "我知道！我也不告诉我妈妈。"], ["大明", "可是照片要问你妈妈要啊！"], ["小月", "对哦……那我只告诉她一点点吧！"], ["大明", "我们还可以请爷爷奶奶给大家说说他们是怎么认识的。我一直都不知道。"], ["小月", "好！我听说是在一个舞会上，爷爷不会跳舞，一直踩到奶奶！"]]], "questions": [{"part": "a", "text": "What do the cousins first suggest, and why does Xiaoyue disagree with the restaurant idea?", "lines": 8}, {"part": "b", "text": "What is their final plan, and why is it a thoughtful one? Use evidence.", "lines": 10}], "schedule": {"evidence": [{"band": "A", "heading": "First ideas", "points": ["Grandparents’ 50th wedding anniversary next month.", "Daming: take the whole family to a famous Chinese restaurant in town.", "Xiaoyue: restaurant too noisy — grandpa’s hearing is poor; last year he couldn’t hear and said nothing."]}, {"band": "M", "heading": "Final plan", "points": ["Cook at home; make a photo book of their young days — find photos from both mothers this weekend.", "Cook Grandma’s favourite fish the way it is made in her home town — taught by her friend Li Nainai, who grew up in the same place."]}, {"band": "E", "heading": "Why thoughtful", "points": ["Considers grandpa’s hearing; personal gifts (photos, home-town dish).", "A surprise — they won’t tell anyone (not even Xiaoyue’s mum — Daming points out she needs her mum’s photos; she’ll tell her “just a little”); ask grandparents how they met — at a dance where grandpa couldn’t dance and kept stepping on grandma.", "Shows care and effort rather than spending money."]}], "A": "Identifies the occasion and some ideas.", "M": "Clearly explains why the restaurant idea is rejected and describes the final plan, with evidence.", "E": "Thoroughly explains why the plan suits the grandparents (hearing, memories, home-town food, surprise) and notes the humorous contradiction about telling no one.", "model": "Their plan is thoughtful because every part is chosen for the grandparents. Daming first suggests a family meal at a restaurant, but Xiaoyue points out restaurants are noisy and grandpa’s hearing is poor. Instead they will cook at home and make a photo book of the couple’s young days, collecting old photos from their mothers this weekend. As Grandma loves fish, they will ask her friend to teach them her home-town fish dish. They keep it a surprise — Xiaoyue even jokes she won’t tell her own mother, though they need her photos. The plan shows care and effort rather than money."}, "id": "2"}, {"title_zh": "我家的老照片", "title_en": "An old family photo", "type": "Speech", "intro": "Listen to Hana giving a speech in class about an old family photo. Refer to the passage in your answer to Question Three.", "allow": ["Hana", "基督城", "香港"], "glosses": [{"zh": "外婆", "py": "wàipó", "en": "grandmother (mother’s mother)"}, {"zh": "行李箱", "py": "xínglixiāng", "en": "suitcase"}, {"zh": "外公", "py": "wàigōng", "en": "grandfather (mother’s father)"}, {"zh": "了不起", "py": "liǎobuqǐ", "en": "amazing, admirable"}], "sections": [[["Hana", "大家好！今天我想给大家介绍一张我家的老照片。"], ["Hana", "这张照片是一九七零年在基督城照的。照片上有一个年轻的女人，她是我的外婆。她手里有一个小行李箱，后边是一条很大的船。她笑得很开心，可是她的眼睛有一点儿红。外婆说，那天她刚下船，又累又怕，可是她告诉自己要笑。"]], [["Hana", "那年外婆二十岁，她一个人从香港坐船来新西兰，在船上住了三个星期。她不会说英文，也不认识一个人。"], ["Hana", "外婆说，第一年她每天晚上都哭，因为太想家了。可是她没有回去。她每天在一家衣服商店工作，晚上去学英文，常常学到十一点。"], ["Hana", "她说，那时候最难的不是工作累，是没有人跟她说话。"]], [["Hana", "后来，她在英文课上认识了我的外公，他是毛利人。他们一起开了一个小商店，开了三十年。很多人都叫外婆“商店奶奶”。"], ["Hana", "每次看这张照片，我都觉得外婆很了不起。她让我知道，很难的时候，也要往前走。"], ["Hana", "下个月外婆八十岁了，我想把这张照片放大，送给她。"]]], "questions": [{"part": "a", "text": "Describe the photo and Hana’s grandmother’s journey to New Zealand.", "lines": 8}, {"part": "b", "text": "What does Hana admire about her grandmother? Explain using evidence.", "lines": 10}], "schedule": {"evidence": [{"band": "A", "heading": "Photo and journey", "points": ["Taken in Christchurch in 1970: young woman (grandmother) with a small suitcase, a big ship behind; smiling but her eyes a little red — she had just got off the ship, tired and scared, but told herself to smile.", "Aged 20, came alone from Hong Kong by ship — three weeks at sea; no English, knew no one."]}, {"band": "M", "heading": "First years", "points": ["Cried every night the first year — homesick — but didn’t go back.", "Worked in a clothes shop by day; studied English at night until 11; hardest thing was having no one to talk to."]}, {"band": "E", "heading": "Admiration", "points": ["Met grandfather (Māori) in English class; ran a small shop together for 30 years — called “shop grandma”.", "Courage and determination despite hardship.", "Lesson for Hana: even when it is hard, keep going forward (很难的时候，也要往前走); will enlarge the photo for her 80th birthday."]}], "A": "Identifies some details of the photo or journey.", "M": "Clearly describes the journey and her grandmother’s early struggles, with evidence.", "E": "Thoroughly explains what Hana admires — courage and persistence despite loneliness — and the lesson she draws.", "model": "Hana admires her grandmother’s courage and determination. The 1970 photo shows her in Christchurch, aged twenty, holding a small suitcase in front of the ship that brought her alone from Hong Kong after three weeks at sea, speaking no English and knowing no one. In her first year she cried every night from homesickness, but she did not go back: she worked in a clothes shop and studied English at night. Later she married Hana’s Māori grandfather and they ran a shop for thirty years. From her, Hana learns that even when things are hard, you must keep going forward."}, "id": "3"}], "level": 2, "kind": "listening"};
const M = {"std_title": "Demonstrate understanding of a variety of spoken Chinese texts on familiar matters", "grades": ["Demonstrate understanding of the texts.", "Demonstrate clear understanding of the texts.", "Demonstrate thorough understanding of the texts."], "instructions": ["Attempt ALL three questions. Answer in English, te reo Māori and / or Chinese.", "Use evidence from the text in every answer — quoting or translating alone is not enough for Merit or Excellence.", "Each passage: play it once as a whole, then play each section up to 2 more times. You choose when to start each play, but you cannot pause inside a play.", "Read the question before you play the passage. Make notes in the Listening notes box.", "Your answers save automatically on this device. Use “Download my answers” to keep or hand in a copy."], "section_plays": 2, "criteria": ["Makes meaning of relevant information, ideas and opinions; shows the general meaning (gist).", "Selects relevant information, ideas and opinions and communicates them unambiguously, with relevant detailed examples from the text.", "Expands on relevant information with supporting detail to show meanings or conclusions implied in the text, including nuance."], "descriptors": ["Very little understanding; general meaning not communicated.", "Little understanding; general meaning not communicated.", "Some understanding; some of the general meaning.", "Understanding; the general meaning.", "Clear understanding; some of the meaning, with relevant supporting detail.", "Clear understanding; most of the meaning, with relevant supporting detail.", "Thorough understanding; some implied meanings, with detail used to justify conclusions.", "Thorough understanding; most implied meanings, conclusions fully justified."], "cuts": ["0–7", "8–13", "14–18", "19–24"], "checks": {"1": {"level": 2, "chars": 355, "coverage": 100.0, "above_level": [], "common_unglossed": ["上", "下", "儿", "刚", "后", "字", "孩子", "年轻", "时候", "每", "没", "照", "真", "给", "自己", "行", "里"], "off_list": []}, "2": {"level": 2, "chars": 335, "coverage": 100.0, "above_level": [], "common_unglossed": ["上", "不太", "再", "别", "哦", "啊", "年轻", "教", "时候", "给", "舞", "里", "问"], "off_list": []}, "3": {"level": 2, "chars": 325, "coverage": 100.0, "above_level": [], "common_unglossed": ["上", "下", "刚", "又", "后", "回", "学", "年轻", "开", "时候", "每", "照", "笑", "红", "给", "自己", "跟", "里"], "off_list": []}}};
const NUM = ['ONE','TWO','THREE','FOUR','FIVE'];
const KEY = 'ncea-pp-' + P.id;
let S = {answers:{}, notes:{}, plays:{}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); document.getElementById('saved').textContent = 'Saved ' + new Date().toLocaleTimeString(); } catch(e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paras = s => String(s ?? '').split(/\n+/).filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join('');

function blocks(list){
  let h = '', i = 0;
  while (i < list.length){
    const b = list[i];
    if (b.type === 'card'){ let g=''; while(i<list.length && list[i].type==='card'){ const c=list[i++]; g+=`<div class="card"><div class="ct">${esc(c.title)}</div>${paras(c.text)}</div>`;} h+=`<div class="cards">${g}</div>`; continue; }
    if (b.type === 'msg'){ let g=''; while(i<list.length && list[i].type==='msg'){ const c=list[i++]; g+=`<div class="msg ${c.side==='right'?'right':''}"><span class="who">${esc(c.who)}</span>${esc(c.text)}</div>`;} h+=`<div class="chat">${g}</div>`; continue; }
    if (b.type === 'email') h += `<div class="email"><div class="eh">${b.from?`发件人：${esc(b.from)}<br>`:''}${b.to?`收件人：${esc(b.to)}<br>`:''}${b.subject?`主题：${esc(b.subject)}`:''}</div><div class="eb">${paras(b.text)}</div></div>`;
    else if (b.type === 'post') h += `<div class="post ${b.reply?'reply':''}"><span class="who">${esc(b.who)}</span><span class="when">${esc(b.when||'')}</span>${paras(b.text)}</div>`;
    else if (b.type === 'heading') h += `<h4>${esc(b.text)}</h4>`;
    else if (b.type === 'image') h += `<div class="imgnote">Image: ${esc(b.alt)}</div>`;
    else h += paras(b.text);
    i++;
  }
  return h;
}
function glossTable(g){
  if (!g || !g.length) return '';
  return `<div class="gloss"><h5>Glossed vocabulary</h5><table class="zh">${g.map(x=>`<tr><td>${esc(x.zh)}</td><td>${esc(x.py)}</td><td>${esc(x.en)}</td></tr>`).join('')}</table></div>`;
}
function partsHTML(item){
  return item.questions.map(q => {
    const k = item.id + (q.part||'');
    return `<div class="part"><p>${q.part?`<b>(${esc(q.part)})</b>`:''}${esc(q.text)}</p>
      <textarea data-k="${esc(k)}" aria-label="Answer ${esc(k)}" style="min-height:${(q.lines||6)*22}px">${esc(S.answers[k]||'')}</textarea></div>`;
  }).join('');
}

function render(){
  const g = M.grades;
  let h = `<header class="top">
    <div class="std"><span class="num">${esc(P.standard)}</span><h1>${esc(M.std_title)}</h1></div>
    <div class="meta">Level ${P.level} Chinese${P.level===1?' (Mandarin)':''} · Practice paper${P.title?': '+esc(P.title):''} · Credits: Five</div>
    <div class="grades"><div><b>Achievement</b>${esc(g[0])}</div><div><b>Merit</b>${esc(g[1])}</div><div><b>Excellence</b>${esc(g[2])}</div></div>
    <ul class="instr">${M.instructions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></header>`;
  P.items.forEach((item, n) => {
    const head = `<div class="qhead"><h2>QUESTION ${NUM[n]}: <span class="zh">${esc(item.title_zh)}</span> (${esc(item.title_en)})</h2><span class="tag">${P.kind==='reading'?'Text '+String.fromCharCode(65+n):(['First','Second','Third'][n]||'')+' passage'}</span></div>`;
    let left;
    if (P.kind === 'reading'){
      left = `<div class="res"><div class="inner"><p class="intro">${esc(item.intro)}</p><div class="text zh">${blocks(item.blocks)}</div>${glossTable(item.glosses)}</div></div>`;
    } else {
      const secs = item.sections.length;
      let btns = `<div class="row"><button class="play" data-q="${item.id}" data-t="whole">▶ Whole passage</button><span class="left" id="left-${item.id}-whole"></span></div><div class="row">`;
      for (let s=1; s<=secs; s++) btns += `<button data-q="${item.id}" data-t="s${s}">▶ Section ${s}</button><span class="left" id="left-${item.id}-s${s}"></span>`;
      btns += `</div>`;
      left = `<div class="res"><div class="inner"><p class="intro">${esc(item.intro)}</p>
        ${item.glosses&&item.glosses.length?`<div class="row"><button data-q="${item.id}" data-t="gloss">🔈 Hear glossed words</button></div>`:''}
        ${glossTable(item.glosses)}
        <div class="player">${btns}<div class="now" id="now-${item.id}"></div></div>
        <div class="notes"><h5 style="margin:0 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Listening notes</h5>
        <textarea data-n="${item.id}" aria-label="Listening notes ${item.id}">${esc(S.notes[item.id]||'')}</textarea></div></div></div>`;
    }
    h += `<section class="q">${head}<div class="cols">${left}<div class="qs">${partsHTML(item)}</div></div></section>`;
  });
  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('textarea[data-k]').forEach(t => t.addEventListener('input', () => { S.answers[t.dataset.k] = t.value; save(); }));
  document.querySelectorAll('textarea[data-n]').forEach(t => t.addEventListener('input', () => { S.notes[t.dataset.n] = t.value; save(); }));
  document.querySelectorAll('button[data-q]').forEach(b => b.addEventListener('click', () => play(b.dataset.q, b.dataset.t)));
  refresh();
}

// ---- listening rules: whole once, then each section M.section_plays times; no pausing inside a play
let current = null, currentBtn = null;
const practice = () => document.getElementById('practice').checked;
const used = (q,t) => (S.plays[q]||{})[t]||0;
const limit = t => t==='whole' ? 1 : t==='gloss' ? 99 : M.section_plays;
function allowed(q,t){
  if (practice()) return true;
  if (t !== 'whole' && t !== 'gloss' && used(q,'whole') < 1) return false;
  return used(q,t) < limit(t);
}
function refresh(){
  document.querySelectorAll('button[data-q]').forEach(b => {
    const {q,t} = b.dataset;
    if (current && !practice()) { b.disabled = true; }
    else b.disabled = !allowed(q,t) && !(practice() && current && currentBtn===b);
    if (practice() && current && currentBtn===b) { b.textContent = '⏸ Stop'; }
    else b.textContent = t==='whole' ? '▶ Whole passage' : t==='gloss' ? '🔈 Hear glossed words' : '▶ Section ' + t.slice(1);
    const l = document.getElementById(`left-${q}-${t}`);
    if (l) l.textContent = practice() ? '' : (t!=='whole' && used(q,'whole')<1 ? 'after whole passage' : `${Math.max(0, limit(t)-used(q,t))} left`);
  });
}
function play(q,t){
  if (current){ if (practice()){ current.pause(); current=null; currentBtn=null; refresh(); } return; }
  if (!allowed(q,t)) return;
  const a = new Audio(`audio/q${q}-${t}.mp3`);
  current = a; currentBtn = document.querySelector(`button[data-q="${q}"][data-t="${t}"]`);
  S.plays[q] = S.plays[q]||{}; S.plays[q][t] = used(q,t)+1; save();
  const now = document.getElementById('now-'+q);
  now.textContent = t==='whole' ? 'Playing the whole passage…' : t==='gloss' ? 'Playing glossed words…' : `Playing section ${t.slice(1)}…`;
  const done = () => { current=null; currentBtn=null; now.textContent=''; refresh(); };
  a.onended = done; a.onerror = () => { now.textContent = 'Audio file missing — run make_audio.py'; done(); };
  a.play().catch(() => done());
  refresh();
}
document.getElementById('practice').addEventListener('change', refresh);

function answersText(){
  let out = `${P.standard} ${M.std_title}\nPractice paper${P.title?': '+P.title:''}\nSaved ${new Date().toLocaleString()}\n\n`;
  P.items.forEach((item,n) => {
    out += `QUESTION ${NUM[n]}: ${item.title_zh} (${item.title_en})\n`;
    if (S.notes[item.id]) out += `[Notes]\n${S.notes[item.id]}\n`;
    item.questions.forEach(q => { const k=item.id+(q.part||''); out += `\n${q.part?'('+q.part+') ':''}${q.text}\n${S.answers[k]||'(no answer)'}\n`; });
    out += '\n\n';
  });
  return out;
}
document.getElementById('dl').onclick = () => {
  const out = answersText();
  const url = URL.createObjectURL(new Blob([out], {type:'text/plain'}));
  const a = document.createElement('a'); a.href = url; a.download = `${P.id}-answers.txt`; a.click(); URL.revokeObjectURL(url);
};
document.getElementById('prn').onclick = () => print();
function showCopyBox(text, msg){
  let box = document.getElementById('copybox');
  if (!box){ box = document.createElement('div'); box.id='copybox'; box.className='copybox';
    box.innerHTML = '<div class="row"><b id="copymsg"></b><button id="copyclose">Close</button></div><textarea id="copytext" aria-label="Your answers as text"></textarea>';
    document.body.appendChild(box); document.getElementById('copyclose').onclick = () => box.remove(); }
  document.getElementById('copymsg').textContent = msg;
  const t = document.getElementById('copytext'); t.value = text; t.focus(); t.select();
}
document.getElementById('copy').onclick = () => {
  const text = answersText();
  const ok = () => { const b=document.getElementById('copy'); b.textContent='Copied ✓'; setTimeout(()=>b.textContent='Copy answers',2000); };
  try { navigator.clipboard.writeText(text).then(ok, () => showCopyBox(text, 'Select all and copy this text:')); }
  catch(e) { showCopyBox(text, 'Select all and copy this text:'); }
};
let clearArmed = null;
document.getElementById('clear').onclick = (ev) => {
  const b = ev.currentTarget;
  if (!clearArmed){ b.textContent = 'Click again to clear'; clearArmed = setTimeout(()=>{ clearArmed=null; b.textContent='Clear'; }, 4000); return; }
  clearTimeout(clearArmed); clearArmed = null; b.textContent = 'Clear';
  S={answers:{},notes:{},plays:{}}; save(); render();
};
if (M.artifact){ document.getElementById('dl').hidden = true; document.getElementById('prn').hidden = true; }
render();
</script>
