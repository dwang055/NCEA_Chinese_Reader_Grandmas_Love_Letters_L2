":"那个星期天，奶奶穿了一件白色的裙子去了湖边，可是她太不好意思了，一直没有说话。他们在湖边坐了很久，看湖水，听鸟唱歌。后来他们每个星期天都在湖边见面。爷爷很会讲故事。奶奶的爸爸知道了以后非常生气，因为爷爷只是一个邮差。安娜明白，奶奶也有一个不同意她的爸爸。"},"diff":{"t":"记 / 记得 / 忘","note":"记 = to note down / remember (记下 = write down; 记住 = memorise). 忘 = forget. In speech, “do you remember?” is often 你还记得吗？","items":[{"s":"我想用照片＿＿下奶奶的故事。","opts":["记","忘"],"a":"记"},{"s":"他一定＿＿了我。","opts":["记","忘"],"a":"忘"},{"s":"请你把老师的话＿＿下来。","opts":["记","忘"],"a":"记"},{"s":"不要＿＿了带手机！","opts":["记","忘"],"a":"忘"}]},"mcq":[{"type":"理解","q":"那个星期天，奶奶穿了什么？","opts":["一件白色的裙子","校服","一件红色的大衣","一件毛衣"],"a":0},{"type":"理解","q":"他们在湖边做了什么？","opts":["划船","照相","看湖水，听鸟唱歌","吃饭"],"a":2},{"type":"理解","q":"爷爷常常讲什么？","opts":["他家乡的山和海","邮差的工作","月亮的故事","新西兰的农场"],"a":0},{"type":"理解","q":"奶奶的爸爸为什么生气？","opts":["奶奶不学习","奶奶回家太晚了","爷爷对他不好","他觉得邮差不能给女儿好的生活"],"a":3},{"type":"语法","q":"从那天开始，我爸爸不＿＿我再去湖边。","opts":["给","让","要","对"],"a":1},{"type":"语法","q":"＿＿，奶奶也有一个不同意她的爸爸。","opts":["然后","以前","后来","原来"],"a":3},{"type":"词汇","q":"“家乡”的意思是：","opts":["countryside","home address","family","hometown"],"a":3},{"type":"词汇","q":"“同样”的意思是：","opts":["same age","agree","together","similarly, the same"],"a":3}],"write":{"en":"Describe a time an adult did not let you do something. What happened, and how did you feel?","zh":"写一写：有一次，一个大人不让你去一个地方。发生了什么？你觉得怎么样？","n":"80–100","model":"去年我想和朋友一起去奥克兰看音乐会，可是我妈妈不让我去。她说我只有十五岁，一个人去太不安全了。我非常生气，一个晚上都没有和她说话。后来我才明白，妈妈不是不让我玩，她只是关心我。"}}},{"id":4,"kind":"letter","title_zh":"雨中的码头","title_en":"The harbour in the rain","date":"1976年3月12日，台湾","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"对不起，昨天在码头，我没有告诉你我想说的话。","en":"I'm sorry — yesterday at the harbour, I didn't tell you what I wanted to say.","py":["duì","bu","qǐ","","zuó","tiān","zài","mǎ","tóu","","wǒ","méi","yǒu","gào","su","nǐ","wǒ","xiǎng","shuō","de","huà",""]},{"t":"letter","who":"爷爷","zh":"你爸爸说得对，现在的我，不能给你好的生活。所以我决定去新西兰工作两年。那里的农场要很多工人，在那里工作，挣钱比这里多。两年以后，我会带钱回来，请你爸爸同意我们在一起。我认为，我们的关系，你爸爸以后会接受的。","en":"Your father is right: as I am now, I can't give you a good life. So I've decided to go to New Zealand to work for two years. The farms there need lots of workers, and you can earn more money there than here. In two years I will come back with money and ask your father to agree to us being together. I believe your father will accept us one day.","py":["nǐ","bà","ba","shuō","de","duì","","xiàn","zài","de","wǒ","","bù","néng","gěi","nǐ","hǎo","de","shēng","huó","","suǒ","yǐ","wǒ","jué","dìng","qù","xīn","xī","lán","gōng","zuò","liǎng","nián","","nà","lǐ","de","nóng","chǎng","yào","hěn","duō","gōng","rén","","zài","nà","lǐ","gōng","zuò","","zhèng","qián","bǐ","zhè","lǐ","duō","","liǎng","nián","yǐ","hòu","","wǒ","huì","dài","qián","huí","lái","","qǐng","nǐ","bà","ba","tóng","yì","wǒ","men","zài","yì","qǐ","","wǒ","rèn","wéi","","wǒ","men","de","guān","xì","","nǐ","bà","ba","yǐ","hòu","huì","jiē","shòu","de",""]},{"t":"letter","who":"爷爷","zh":"昨天下雨，你在码头哭了，我也很难过。可是请你相信我：我每个月都会给你写一封信。你看到月亮的时候，就像看到我。请你对我有信心，我一定会成功。","en":"Yesterday it rained, and you cried at the harbour. I was very sad too. But please believe me: I will write you a letter every month. When you look at the moon, it will be like seeing me. Please have faith in me — I will succeed.","py":["zuó","tiān","xià","yǔ","","nǐ","zài","mǎ","tóu","kū","le","","wǒ","yě","hěn","nán","guò","","kě","shì","qǐng","nǐ","xiāng","xìn","wǒ","","wǒ","měi","gè","yuè","dōu","huì","gěi","nǐ","xiě","yì","fēng","xìn","","nǐ","kàn","dào","yuè","liang","de","shí","hou","","jiù","xiàng","kàn","dào","wǒ","","qǐng","nǐ","duì","wǒ","yǒu","xìn","xīn","","wǒ","yí","dìng","huì","chéng","gōng",""]},{"t":"letter","who":"爷爷","zh":"等我回来。","en":"Wait for me to come back.","py":["děng","wǒ","huí","lái",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"What has Hai decided to do, and why?","points":["Go to New Zealand to work for two years.","Farms there need lots of workers; he can earn more money than at home.","He will come back with money and ask her father to agree to them being together."],"model":"Hai has decided to work in New Zealand for two years because farms there need many workers and he can earn more than at home. He plans to come back with money and ask Yue's father to accept their relationship."},{"band":"E","q":"How does Hai try to comfort Yue in this letter, and what does this show about his feelings?","points":["He admits her father is right — he takes responsibility instead of blaming him.","Promises a letter every month; 'please believe me'.","The moon image: when she sees the moon it is like seeing him — they share it despite distance.","Shows deep, committed love and determination ('wait for me to come back')."],"model":"Hai comforts Yue with promises and an image. He accepts that her father is right — he can't give her a good life yet — so instead of blaming anyone he takes responsibility and makes a plan. He begs her to believe him and promises a letter every month, and he gives her the moon: whenever she sees it, it will be like seeing him, so the distance won't separate them. His last line, 'wait for me to come back', shows how committed and determined he is, even though he is also sad (我也很难过)."}],"title_py":"yǔ zhōng de mǎ tóu","exercises":{"match":[{"zh":"码头","en":"harbour, wharf"},{"zh":"决定","en":"to decide"},{"zh":"工人","en":"worker"},{"zh":"挣钱","en":"to earn money"},{"zh":"相信","en":"to believe, trust"},{"zh":"月亮","en":"the moon"}],"opts":[5,0,3,2,4,1],"bank":["哭","挣钱","告诉","决定","难过","相信"],"fill":[{"s":"我＿＿明年去中国学习汉语。","a":"决定"},{"s":"他去农场工作，想＿＿帮助家人。","a":"挣钱"},{"s":"请你＿＿我，我一定会回来。","a":"相信"},{"s":"你为什么不＿＿我你要走？","a":"告诉"},{"s":"好朋友搬家了，我很＿＿。","a":"难过"}],"grammar":[{"t":"比 (comparing)","p":"A + 比 + B + adjective","note":"A 比 B + adjective = A is more … than B. Never add 很: say 他比我高, not 他比我很高. For “much more” add 很多 / 多了 at the end.","eg":"那里的农场要很多工人，在那里工作，挣钱比这里多。","order":[{"w":["比","新西兰的","冷","冬天","台湾"],"s":"新西兰的冬天比台湾冷。","en":"New Zealand's winter is colder than Taiwan's.","alt":[]},{"w":["我","哥哥","我","高","比","很多"],"s":"我哥哥比我高很多。","en":"My older brother is much taller than me.","alt":[]}],"make":[{"q":"Say: “Photography is more interesting than maths.”","a":"摄影比数学有意思。"}]},{"t":"就像 (just like)","p":"A + 就像 + B","note":"就像 compares two things that feel the same: “it’s just like …”.","eg":"你看到月亮的时候，就像看到我。","order":[{"w":["就像","奶奶","好朋友","我的"],"s":"奶奶就像我的好朋友。","en":"Grandma is just like my best friend.","alt":[]},{"w":["回到了","那一年","这张","就像","看到","照片"],"s":"看到这张照片，就像回到了那一年。","en":"Seeing this photo is like going back to that year.","alt":[]}],"make":[{"q":"Say: “This city is just like my home.”","a":"这个城市就像我的家。"}]}]},"lesson":{"listen":{"q":"Why does Grandpa decide to go to New Zealand, and what does he promise?","a":"Her father is right that he cannot give her a good life now, so he will work two years on a NZ farm to earn more; he promises to write every month and come back for her."},"words":[{"zh":"工人","py":"gōngrén","en":"worker"},{"zh":"挣钱","py":"zhèngqián","en":"to earn money"},{"zh":"同意","py":"tóngyì","en":"to agree"},{"zh":"认为","py":"rènwéi","en":"to think, to consider"},{"zh":"关系","py":"guān xì","en":"relationship"},{"zh":"接受","py":"jiēshòu","en":"to accept, to receive"},{"zh":"哭","py":"kū","en":"to cry"},{"zh":"难过","py":"nánguò","en":"feel sad"},{"zh":"相信","py":"xiāngxìn","en":"to believe, to trust"},{"zh":"月亮","py":"yuèliang","en":"moon"},{"zh":"信心","py":"xìnxīn","en":"confidence"},{"zh":"一定","py":"yídìng","en":"surely"},{"zh":"成功","py":"chénggōng","en":"success, to succeed"}],"notes":[{"zh":"现在的我","en":"me as I am now"},{"zh":"挣钱比这里多","en":"earns more money than here"},{"zh":"请你爸爸同意我们在一起","en":"ask your father to agree to us being together"},{"zh":"你看到月亮的时候，就像看到我","en":"when you see the moon, it is like seeing me"}],"summary":{"qs":["爷爷昨天在码头没有做什么？","他决定去哪里？做什么？多长时间？","为什么去那里？","两年以后他打算做什么？","他说月什么？","他说看到月亮的时候怎么样？"],"limit":110,"model":"昨天在码头，爷爷没有告诉月他想说的话。他决定去新西兰的农场工作两年，因为在那里挣钱比台湾多。两年以后，他打算带钱回来，请月的爸爸同意他们在一起。他说每个月都会给月写一封信，看到月亮的时候，就像看到他。"},"diff":{"t":"再 / 又","note":"又 = again (already happened): 我又想到爸爸的话. 再 = again (in the future): 我不会再给你写信了 / 下次再来.","items":[{"s":"我＿＿想到爸爸在车上说的话。 (happened)","opts":["再","又"],"a":"又"},{"s":"我不会＿＿给你写信了。 (future)","opts":["再","又"],"a":"再"},{"s":"昨天下雨，今天＿＿下雨了。","opts":["再","又"],"a":"又"},{"s":"请你明天＿＿来。","opts":["再","又"],"a":"再"}]},"mcq":[{"type":"理解","q":"爷爷要去新西兰工作多长时间？","opts":["一辈子","五年","一年","两年"],"a":3},{"type":"理解","q":"爷爷在新西兰做什么工作？","opts":["农场工人","老师","邮差","医生"],"a":0},{"type":"理解","q":"昨天在码头，天气怎么样？","opts":["下雪","下雨","晴天","刮风"],"a":1},{"type":"理解","q":"爷爷认为月的爸爸以后会怎么样？","opts":["一直生气","接受他们的关系","去新西兰","给他写信"],"a":1},{"type":"语法","q":"在那里工作，挣钱＿＿这里多。","opts":["比","跟","对","和"],"a":0},{"type":"语法","q":"你看到月亮的时候，＿＿看到我。","opts":["一样","比如","好像是","就像"],"a":3},{"type":"词汇","q":"“信心”的意思是：","opts":["trust a letter","letter","confidence","heart"],"a":2},{"type":"词汇","q":"“成功”的意思是：","opts":["to finish","to succeed","to become","to win a prize"],"a":1}],"write":{"en":"Write a letter making a promise to someone you have to leave for a while.","zh":"你要离开一个人很长时间。给他/她写一封信，说说你的打算。","n":"80–100","model":"妈妈：明天我就要去惠灵顿上大学了。虽然我会很想家，但是请您对我有信心。我打算每个星期给您打电话，每个月回家一次。我一定会好好学习，也会照顾好自己。您看到我们家的大树，就像看到我。"}}},{"id":5,"kind":"now","title_zh":"我和爸爸吵架了","title_en":"My argument with Dad","blocks":[{"t":"p","zh":"星期五晚上，我告诉爸爸，学校有一个摄影比赛，我想参加。照片最好的学生可以去惠灵顿学习摄影一个星期。这是一个很好的机会。","en":"On Friday evening I told Dad that school has a photography competition and I want to enter. The student with the best photo can go to Wellington to study photography for a week. It was a great chance.","py":["xīng","qī","wǔ","wǎn","shang","","wǒ","gào","su","bà","ba","","xué","xiào","yǒu","yí","gè","shè","yǐng","bǐ","sài","","wǒ","xiǎng","cān","jiā","","zhào","piàn","zuì","hǎo","de","xué","sheng","kě","yǐ","qù","huì","líng","dùn","xué","xí","shè","yǐng","yí","gè","xīng","qī","","zhè","shì","yí","gè","hěn","hǎo","de","jī","huì",""]},{"t":"say","who":"爸爸","zh":"“摄影比赛？下个月就要考试了，你应该多复习数学！摄影以后能当工作吗？”","en":"\"A photography competition? You've got exams next month — you should be revising maths! Can taking photos ever be a job?\"","py":["","shè","yǐng","bǐ","sài","","xià","gè","yuè","jiù","yào","kǎo","shì","le","","nǐ","yīng","gāi","duō","fù","xí","shù","xué","","shè","yǐng","yǐ","hòu","néng","dāng","gōng","zuò","ma","",""]},{"t":"say","who":"安娜","zh":"“可是我最喜欢摄影！你一点儿都不明白我！”","en":"\"But photography is what I love most! You don't understand me at all!\"","py":["","kě","shì","wǒ","zuì","xǐ","huan","shè","yǐng","","nǐ","yì","diǎn","r","dōu","bù","míng","bai","wǒ","",""]},{"t":"p","zh":"我跑回自己的房间，哭了很久。我对爸爸很失望。","en":"I ran back to my room and cried for a long time. I was so disappointed in Dad.","py":["wǒ","pǎo","huí","zì","jǐ","de","fáng","jiān","","kū","le","hěn","jiǔ","","wǒ","duì","bà","ba","hěn","shī","wàng",""]},{"t":"p","zh":"过了一会儿，奶奶来了。她坐在我旁边，给了我一封爷爷的信。","en":"After a while, Grandma came in. She sat down beside me and gave me one of Grandpa's letters.","py":["guò","le","yí","huì","r","","nǎi","nai","lái","le","","tā","zuò","zài","wǒ","páng","biān","","gěi","le","wǒ","yì","fēng","yé","ye","de","xìn",""]},{"t":"say","who":"奶奶","zh":"“安娜，你爸爸很爱你，就像我爸爸很爱我。他们只是不知道，应该怎么爱我们。”","en":"\"Ana, your dad loves you very much, just like my father loved me. They just don't know how they should love us.\"","py":["","ān","nà","","nǐ","bà","ba","hěn","ài","nǐ","","jiù","xiàng","wǒ","bà","ba","hěn","ài","wǒ","","tā","men","zhǐ","shì","bù","zhī","dao","","yīng","gāi","zěn","me","ài","wǒ","men","",""]},{"t":"p","zh":"我看奶奶，不知道应该说什么。","en":"I looked at Grandma and didn't know what to say.","py":["wǒ","kàn","nǎi","nai","","bù","zhī","dao","yīng","gāi","shuō","shén","me",""]}],"questions":[{"band":"A","q":"Why do Ana and her dad argue?","points":["Ana wants to enter a school photography competition; the best photo wins a week of photography study in Wellington.","Dad says exams are next month, she should revise maths, and doubts photography can be a job.","Ana says photography is what she loves most and that he doesn't understand her."],"model":"Ana wants to enter the school photography competition — the best photo wins a week studying photography in Wellington. Dad objects because exams are next month and he thinks she should revise maths; he doubts photography could ever be a job. Ana replies that it is what she loves most and that he doesn't understand her."},{"band":"E","q":"What does Grandma mean by 'they just don't know how they should love us'? Explain how it links to her own story.","points":["Parents' opposition comes from love, not from not caring.","Dad's worry about exams/jobs = care for Ana's future, like Grandma's father worrying a postman couldn't give her a good life.","Grandma sees both conflicts as the same: love expressed as control. She gives Ana a letter so she can see it for herself."],"model":"Grandma means that parents who stand in their children's way usually do so out of love, but express it badly — through control and worry rather than understanding. Ana's dad pushes maths because he cares about her exams and future job, just as Grandma's father opposed a poor postman because he wanted her to have a good life. By saying 'just like my father loved me' and handing Ana one of Grandpa's letters, Grandma is linking the two stories and asking Ana to see her father's anger as care."}],"title_py":"wǒ hé bà ba chǎo jià le","exercises":{"match":[{"zh":"比赛","en":"competition"},{"zh":"参加","en":"to take part in"},{"zh":"考试","en":"exam"},{"zh":"复习","en":"to revise"},{"zh":"明白","en":"to understand"},{"zh":"吵架","en":"to argue"}],"opts":[1,5,4,0,2,3],"bank":["明白","爱","比赛","考试","复习","参加"],"fill":[{"s":"我想＿＿学校的摄影比赛。","a":"参加"},{"s":"明天有数学考试，我今天晚上要＿＿。","a":"复习"},{"s":"老师说得很慢，我都＿＿了。","a":"明白"},{"s":"下个星期有一个游泳＿＿。","a":"比赛"},{"s":"爸爸妈妈都很＿＿我。","a":"爱"}],"grammar":[{"t":"就要 … 了 (very soon)","p":"(time) + 就要 + verb + 了","note":"就要 … 了 says something will happen very soon. A time word can come before it.","eg":"下个月就要考试了，你应该多复习数学！","order":[{"w":["星期","放假","就要","下个","了"],"s":"下个星期就要放假了。","en":"The holidays start next week.","alt":[]},{"w":["搬家","奶奶","了","就要"],"s":"奶奶就要搬家了。","en":"Grandma is moving very soon.","alt":[]}],"make":[{"q":"Say: “The competition is about to start; I need to go and take photos.”","a":"比赛就要开始了，我要去照相。"}]},{"t":"verb + 了 + how long","p":"verb + 了 + length of time","note":"How long something lasts comes AFTER the verb: 哭了很久 (cried for a long time), 学了两年 (studied for two years).","eg":"我跑回自己的房间，哭了很久。","order":[{"w":["很久","他们","坐了","在","湖边"],"s":"他们在湖边坐了很久。","en":"They sat by the lake for a long time.","alt":[]},{"w":["小时","复习了","昨天","我","三个"],"s":"我昨天复习了三个小时。","en":"Yesterday I revised for three hours.","alt":["昨天我复习了三个小时"]}],"make":[{"q":"Say: “I waited for you for an hour.”","a":"我等了你一个小时。"}]}]},"lesson":{"listen":{"q":"Why do Ana and her father argue, and what does Grandma say?","a":"Ana wants to enter a photography competition but Dad wants her to revise maths; Grandma says Dad loves her, but parents don’t always know how to show it."},"words":[{"zh":"比赛","py":"bǐsài","en":"competition, match"},{"zh":"参加","py":"cānjiā","en":"to participate, to join in"},{"zh":"机会","py":"jīhuì","en":"chance, opportunity"},{"zh":"复习","py":"fùxí","en":"to review, to revise"},{"zh":"当","py":"dāng","en":"to work as, to be (当工作 = be a job)"},{"zh":"失望","py":"shīwàng","en":"disappointed"},{"zh":"一会(儿)","py":"yíhuì (ér)","en":"for a while"}],"notes":[{"zh":"下个月就要考试了","en":"exams are coming up next month"},{"zh":"摄影以后能当工作吗？","en":"can photography be a job later on?"},{"zh":"你一点儿都不明白我","en":"you don't understand me at all"},{"zh":"他们只是不知道，应该怎么爱我们","en":"they just don't know how they should love us"}],"summary":{"qs":["学校有什么比赛？最好的学生可以做什么？","爸爸为什么不同意？","安娜对爸爸说了什么？","安娜跑回房间以后怎么样？","奶奶给了安娜什么？","奶奶说了什么？"],"limit":110,"model":"学校有一个摄影比赛，照片最好的学生可以去惠灵顿学习摄影一个星期。爸爸不同意，因为下个月就要考试了，他觉得安娜应该多复习数学。安娜说爸爸一点儿都不明白她，然后跑回房间哭了很久，她对爸爸很失望。奶奶给了她一封爷爷的信，说爸爸很爱她，只是不知道应该怎么爱她。"},"diff":{"t":"照顾 / 关心","note":"照顾 = to look after (do things for someone: 照顾孩子, 照顾病人). 关心 = to care about (pay attention, worry about): 关心我的学习.","items":[{"s":"妈妈生病了，我在家＿＿她。","opts":["照顾","关心"],"a":"照顾"},{"s":"爸爸从来不＿＿我喜欢什么。","opts":["照顾","关心"],"a":"关心"},{"s":"如果你来，我会＿＿你一辈子。","opts":["照顾","关心"],"a":"照顾"},{"s":"老师很＿＿我们的成绩。","opts":["照顾","关心"],"a":"关心"}]},"mcq":[{"type":"理解","q":"摄影比赛的好处是什么？","opts":["一个新手机","去惠灵顿学习摄影一个星期","去台湾","很多钱"],"a":1},{"type":"理解","q":"爸爸要安娜做什么？","opts":["学中文","照顾奶奶","多复习数学","去惠灵顿"],"a":2},{"type":"理解","q":"安娜跑回房间以后：","opts":["给朋友打电话","哭了很久","开始复习","睡觉了"],"a":1},{"type":"理解","q":"奶奶觉得安娜的爸爸：","opts":["太忙了","不爱她","很爱她，只是不知道怎么爱","很聪明"],"a":2},{"type":"语法","q":"下个月＿＿考试了。","opts":["刚才","就要","要是","已经"],"a":1},{"type":"语法","q":"我跑回自己的房间，哭＿＿很久。","opts":["的","过","吗","了"],"a":3},{"type":"词汇","q":"“机会”的意思是：","opts":["meeting","machine","chance, opportunity","luck"],"a":2},{"type":"词汇","q":"“失望”的意思是：","opts":["tired","hopeful","disappointed","lost"],"a":2}],"write":{"en":"You and a parent disagree about how you spend your time. Write what each of you thinks, and how you could solve it.","zh":"你和爸爸/妈妈对你怎么用时间想的不一样。写一写你们怎么想，你们可以怎么做？","n":"80–100","model":"我很喜欢打网球，每个周末都去打。可是我妈妈认为我应该多学习，因为下个月就要期末考试了。我觉得运动对身体好，也可以让我学得比较好。后来我们说好：星期六上午我学习，下午去打网球。"}}},{"id":6,"kind":"letter","title_zh":"南半球的月亮","title_en":"The moon of the Southern Hemisphere","date":"1977年1月20日，新西兰南岛","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"这是我在新西兰写的第十封信了。","en":"This is the tenth letter I have written in New Zealand.","py":["zhè","shì","wǒ","zài","xīn","xī","lán","xiě","de","dì","shí","fēng","xìn","le",""]},{"t":"letter","who":"爷爷","zh":"现在这里是夏天，天气很好，草地非常绿，农场里有一千多只羊。我每天早上五点起床，工作到晚上七点。很累，可是我不怕。我很想家，也很想你。","en":"It's summer here now. The weather is lovely, the grass is so green, and the farm has more than a thousand sheep. Every day I get up at five and work until seven in the evening. It's tiring, but I'm not afraid. I'm homesick, and I miss you.","py":["xiàn","zài","zhè","lǐ","shì","xià","tiān","","tiān","qì","hěn","hǎo","","cǎo","dì","fēi","cháng","lǜ","","nóng","chǎng","lǐ","yǒu","yì","qiān","duō","zhǐ","yáng","","wǒ","měi","tiān","zǎo","shàng","wǔ","diǎn","qǐ","chuáng","","gōng","zuò","dào","wǎn","shang","qī","diǎn","","hěn","lèi","","kě","shì","wǒ","bú","pà","","wǒ","hěn","xiǎng","jiā","","yě","hěn","xiǎng","nǐ",""]},{"t":"letter","who":"爷爷","zh":"晚上，我常常一个人坐在草地上看星星。这里的星星和台湾的不一样，可是月亮是一样的。我给你写了一首小诗：","en":"At night I often sit alone on the grass looking at the stars. The stars here are different from Taiwan's, but the moon is the same. I wrote you a little poem:","py":["wǎn","shang","","wǒ","cháng","cháng","yí","gè","rén","zuò","zài","cǎo","dì","shàng","kàn","xīng","xing","","zhè","lǐ","de","xīng","xing","hé","tái","wān","de","bù","yí","yàng","","kě","shì","yuè","liang","shì","yí","yàng","de","","wǒ","gěi","nǐ","xiě","le","yì","shǒu","xiǎo","shī",""]},{"t":"poem","who":"爷爷","zh":"你在北半球看月亮，\n我在南半球想你。\n月亮只有一个，\n就像我的心，只给你。","en":"You look at the moon in the north,\nI miss you in the south.\nThere is only one moon —\nlike my heart, only for you.","py":["nǐ","zài","běi","bàn","qiú","kàn","yuè","liang","","","wǒ","zài","nán","bàn","qiú","xiǎng","nǐ","","","yuè","liang","zhǐ","yǒu","yí","gè","","","jiù","xiàng","wǒ","de","xīn","","zhǐ","gěi","nǐ",""]},{"t":"letter","who":"爷爷","zh":"你最近好吗？你爸爸还在生气吗？为什么你已经三个月没有给我写信了？晚安，月。","en":"How are you? Is your father still angry? Why haven't you written to me for three months? Good night, Yue.","py":["nǐ","zuì","jìn","hǎo","ma","","nǐ","bà","ba","hái","zài","shēng","qì","ma","","wèi","shén","me","nǐ","yǐ","jīng","sān","gè","yuè","méi","yǒu","gěi","wǒ","xiě","xìn","le","","wǎn","ān","","yuè",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"Describe Hai's life in New Zealand.","points":["Summer: good weather, very green grass, more than 1,000 sheep on the farm.","Gets up at 5 and works until 7 pm; tiring but he isn't afraid.","At night sits alone on the grass looking at the stars."],"model":"Hai works on a South Island farm with more than a thousand sheep. It is summer, the weather is good and the grass very green. He gets up at five and works until seven at night; it is exhausting, but he says he is not afraid. At night he sits alone on the grass looking at the stars."},{"band":"E","q":"What does the poem mean, and why might Hai be worried at the end of the letter?","points":["North/south hemispheres show the distance; the one moon they both see is like his heart — only for her: loyalty despite distance.","Worry: she hasn't written for three months; he asks if her father is still angry — he suspects something is wrong.","Irony (for the reader): we will learn the letters were hidden."],"model":"In the poem, Yue looks at the moon in the northern hemisphere while Hai misses her from the southern hemisphere: the hemispheres show how far apart they are. But there is only one moon, which they both see — just like his heart, which belongs only to her. It is a promise of loyalty despite the distance. At the end, though, Hai is worried: Yue hasn't written for three months. He asks whether her father is still angry, which shows he suspects her father is behind the silence — and the reader later discovers he is right."}],"title_py":"nán bàn qiú de yuè liang","exercises":{"match":[{"zh":"草地","en":"grass, lawn"},{"zh":"羊","en":"sheep"},{"zh":"累","en":"tired"},{"zh":"怕","en":"to be afraid"},{"zh":"星星","en":"star"},{"zh":"诗","en":"poem"}],"opts":[2,4,5,1,0,3],"bank":["累","草地","星星","一样","怕","起床"],"fill":[{"s":"我每天早上七点＿＿。","a":"起床"},{"s":"工作了一天，我非常＿＿。","a":"累"},{"s":"天气好的晚上，可以看到很多＿＿。","a":"星星"},{"s":"我妹妹很＿＿狗。","a":"怕"},{"s":"小孩子在＿＿上玩。","a":"草地"}],"grammar":[{"t":"number + 多 (more than)","p":"round number + 多 + measure word + noun","note":"多 after a round number means “more than”: 一千多只羊 (1,000-plus sheep), 七十多岁 (over seventy).","eg":"农场里有一千多只羊。","order":[{"w":["学生","学校","我们","个","五百","有","多"],"s":"我们学校有五百多个学生。","en":"Our school has more than 500 students.","alt":[]},{"w":["七十","奶奶","今年","多","岁","了"],"s":"奶奶今年七十多岁了。","en":"Grandma is over seventy this year.","alt":[]}],"make":[{"q":"Say: “There are more than thirty people in my class.”","a":"我们班有三十多个人。"}]},{"t":"已经 + time + 没(有) … 了","p":"已经 + length of time + 没(有) + verb + 了","note":"To say how long something has NOT happened, put the time before 没有.","eg":"为什么你已经三个月没有给我写信了？","order":[{"w":["星期","见到","两个","没有","了","我","他","已经"],"s":"我已经两个星期没有见到他了。","en":"I haven't seen him for two weeks.","alt":[]},{"w":["没有","已经","一年","了","回","她","家"],"s":"她已经一年没有回家了。","en":"She hasn't been home for a year.","alt":[]}],"make":[{"q":"Say: “I haven’t eaten Chinese food for three months.”","a":"我已经三个月没有吃中国菜了。"}]}]},"lesson":{"listen":{"q":"What is life like for Grandpa on the farm, and what worries him?","a":"Summer, green grass, over a thousand sheep; he works 5 am to 7 pm, tired but not afraid; he is homesick and worried because she hasn't written for three months."},"words":[{"zh":"草地","py":"cǎodì","en":"lawn, grassland"},{"zh":"怕","py":"pà","en":"be afraid of"},{"zh":"想家","py":"xiǎng jiā","en":"homesick, missing home"},{"zh":"星星","py":"xīngxing","en":"stars"},{"zh":"北半球","py":"běibànqiú","en":"northern hemisphere"},{"zh":"南半球","py":"nánbànqiú","en":"southern hemisphere"},{"zh":"晚安","py":"wǎn'ān","en":"good night"}],"notes":[{"zh":"这是我在新西兰写的第十封信了","en":"this is the tenth letter I've written in New Zealand"},{"zh":"工作到晚上七点","en":"work until seven in the evening"},{"zh":"这里的星星和台湾的不一样","en":"the stars here are different from Taiwan’s"},{"zh":"三个月没有给我写信了","en":"haven't written to me for three months"}],"summary":{"qs":["这是爷爷写的第几封信？","新西兰现在是什么季节？农场怎么样？","爷爷每天的工作时间是怎么样的？","晚上他常常做什么？","他给月写了什么？","他有什么问题？"],"limit":110,"model":"这是爷爷在新西兰写的第十封信。现在新西兰是夏天，草地非常绿，农场里有一千多只羊。爷爷每天从早上五点工作到晚上七点，很累，可是他不怕。晚上他常常一个人看星星，很想家。他给月写了一首小诗。他想知道，月为什么已经三个月没有给他写信了。"},"diff":{"t":"相信 / 认为","note":"相信 = to believe / trust (相信我, 我不相信你忘了我). 认为 = to think, hold an opinion (我认为他是对的).","items":[{"s":"请你＿＿我：我每个月都会写信。","opts":["相信","认为"],"a":"相信"},{"s":"我＿＿，你爸爸以后会接受的。","opts":["相信","认为"],"a":"认为"},{"s":"我不＿＿你忘了我。","opts":["相信","认为"],"a":"相信"},{"s":"你＿＿摄影能当工作吗？","opts":["相信","认为"],"a":"认为"}]},"mcq":[{"type":"理解","q":"农场里有多少只羊？","opts":["十几只","一千多只","一万多只","一百多只"],"a":1},{"type":"理解","q":"爷爷每天几点起床？","opts":["七点","五点","四点","六点"],"a":1},{"type":"理解","q":"爷爷说什么是一样的？","opts":["草地","月亮","星星","天气"],"a":1},{"type":"理解","q":"月多长时间没有给爷爷写信了？","opts":["一年","两个月","一个月","三个月"],"a":3},{"type":"语法","q":"农场里有一千＿＿只羊。","opts":["个","些","点","多"],"a":3},{"type":"语法","q":"你已经三个月＿＿给我写信了。","opts":["别","不","没有","没有了"],"a":2},{"type":"词汇","q":"“想家”的意思是：","opts":["to think about a house","homesick","hometown","family"],"a":1},{"type":"词汇","q":"“晚安”的意思是：","opts":["good evening","safe evening","good night","late"],"a":2}],"write":{"en":"You are working or studying far from home. Write a letter describing your day and how you feel.","zh":"你在一个离家很远的地方工作和学习。写一封信，说说你的一天和你的感觉。","n":"80–100","model":"妈妈：我到上海已经两个月了。我每天早上七点起床，八点上课，下午五点下课。上海的冬天很冷，可是我的同学都很热情。晚上我常常一个人在房间里看书，有时候很想家。您最近好吗？晚安。小明"}}},{"id":7,"kind":"now","title_zh":"没有打开的信","title_en":"The unopened letters","blocks":[{"t":"p","zh":"在盒子的最下面，我找到了十几封没有打开的信。每一封都是爷爷从新西兰发来的。","en":"At the very bottom of the box I found more than ten unopened letters. Every one had been sent by Grandpa from New Zealand.","py":["zài","hé","zi","de","zuì","xià","miàn","","wǒ","zhǎo","dào","le","shí","jǐ","fēng","méi","yǒu","dǎ","kāi","de","xìn","","měi","yì","fēng","dōu","shì","yé","ye","cóng","xīn","xī","lán","fā","lái","de",""]},{"t":"say","who":"安娜","zh":"“奶奶，这些信为什么没有打开？”","en":"\"Grandma, why haven't these letters been opened?\"","py":["","nǎi","nai","","zhè","xiē","xìn","wèi","shén","me","méi","yǒu","dǎ","kāi","",""]},{"t":"p","zh":"奶奶看了这些信很久，眼睛红了。","en":"Grandma looked at the letters for a long time, and her eyes turned red.","py":["nǎi","nai","kàn","le","zhè","xiē","xìn","hěn","jiǔ","","yǎn","jīng","hóng","le",""]},{"t":"say","who":"奶奶","zh":"“那一年，我一封信也没有收到。我觉得他一定忘了我，在新西兰认识了别的女生。我每天晚上都哭。后来，我爸爸让我认识了一个医生。他很有钱，可是我一点儿都不喜欢他。”","en":"\"That year, I didn't receive a single letter. I thought he must have forgotten me and met another girl in New Zealand. I cried every night. Later, my father introduced me to a doctor. He was rich, but I didn't like him at all.\"","py":["","nà","yì","nián","","wǒ","yì","fēng","xìn","yě","méi","yǒu","shōu","dào","","wǒ","jué","de","tā","yí","dìng","wàng","le","wǒ","","zài","xīn","xī","lán","rèn","shi","le","bié","de","nǚ","shēng","","wǒ","měi","tiān","wǎn","shang","dōu","kū","","hòu","lái","","wǒ","bà","ba","ràng","wǒ","rèn","shi","le","yí","gè","yī","shēng","","tā","hěn","yǒu","qián","","kě","shì","wǒ","yì","diǎn","r","dōu","bù","xǐ","huan","tā","",""]},{"t":"say","who":"安娜","zh":"“那这些信……”","en":"\"So these letters…\"","py":["","nà","zhè","xiē","xìn","","",""]},{"t":"say","who":"奶奶","zh":"“很多年以后，我才知道，是我爸爸把这些信都藏起来了。”","en":"\"Many years later, I found out that my father had hidden all these letters.\"","py":["","hěn","duō","nián","yǐ","hòu","","wǒ","cái","zhī","dao","","shì","wǒ","bà","ba","bǎ","zhè","xiē","xìn","dōu","cáng","qǐ","lai","le","",""]},{"t":"p","zh":"我看这些信，很难过。爷爷每个月都在写信，可是奶奶一直不知道。","en":"I looked at the letters and felt very sad. Grandpa had written every month, but Grandma never knew.","py":["wǒ","kàn","zhè","xiē","xìn","","hěn","nán","guò","","yé","ye","měi","gè","yuè","dōu","zài","xiě","xìn","","kě","shì","nǎi","nai","yì","zhí","bù","zhī","dao",""]}],"questions":[{"band":"A","q":"What does Ana find, and what really happened to the letters?","points":["More than ten unopened letters from Grandpa in New Zealand, at the bottom of the box.","Grandma received none that year; many years later she learned her father had hidden them."],"model":"At the bottom of the box Ana finds more than ten unopened letters Grandpa sent from New Zealand. That year Grandma received none of them; many years later she learned that her father had hidden them all."},{"band":"E","q":"How did the missing letters affect Grandma at the time? Why is this chapter so sad?","points":["She believed Hai had forgotten her and met another girl; cried every night.","Her father introduced her to a rich doctor she didn't like — he used the silence to push another match.","Sad because both were faithful: Grandpa wrote every month, Grandma kept loving him, but neither knew; her eyes still turn red decades later."],"model":"Because no letters came, Grandma believed Hai had forgotten her and found another girl in New Zealand, and she cried every night. Her father took advantage of this: he introduced her to a rich doctor, whom she didn't like at all. The chapter is so sad because both of them stayed faithful — Grandpa wrote every single month and Grandma kept loving him — yet each thought the other had given up. Even decades later, Grandma's eyes turn red when she looks at the unopened letters, showing how deep that pain was."}],"title_py":"méi yǒu dǎ kāi de xìn","exercises":{"match":[{"zh":"收到","en":"to receive"},{"zh":"眼睛","en":"eyes"},{"zh":"一定","en":"surely, must"},{"zh":"别的","en":"other"},{"zh":"医生","en":"doctor"},{"zh":"藏起来","en":"to hide (away)"}],"opts":[2,4,3,0,5,1],"bank":["收到","哭","一定","别的","眼睛","医生"],"fill":[{"s":"你＿＿我的信了吗？","a":"收到"},{"s":"他今天没来上课，＿＿是生病了。","a":"一定"},{"s":"我不喜欢这个颜色，有＿＿颜色吗？","a":"别的"},{"s":"她生病了，要去看＿＿。","a":"医生"},{"s":"奶奶的＿＿红了，她很难过。","a":"眼睛"}],"grammar":[{"t":"一 … 也没(有)","p":"一 + measure word + noun + 也没(有) / 也不 + verb","note":"This pattern means “not a single …”. The thing comes BEFORE the verb.","eg":"那一年，我一封信也没有收到。","order":[{"w":["说","没有","一","个","也","字","他"],"s":"他一个字也没有说。","en":"He didn't say a single word.","alt":[]},{"w":["喝","没","今天","杯","水","一","也","我"],"s":"我今天一杯水也没喝。","en":"I haven't drunk a single glass of water today.","alt":["今天我一杯水也没喝"]}],"make":[{"q":"Say: “I didn’t take a single photo.”","a":"我一张照片也没有照。"}]},{"t":"才 (not until)","p":"time / condition + 才 + verb","note":"才 = “only then / not until” — later than expected. Don’t put 了 after the verb.","eg":"很多年以后，我才知道，是我爸爸把这些信都藏起来了。","order":[{"w":["才","回家","十点","他","晚上"],"s":"他晚上十点才回家。","en":"He didn't get home until ten at night.","alt":[]},{"w":["以后","明白","信","看了","我","才"],"s":"我看了信以后才明白。","en":"Only after reading the letter did I understand.","alt":[]}],"make":[{"q":"Say: “I only found out today.”","a":"我今天才知道。"}]}]},"lesson":{"listen":{"q":"Why didn't Grandma receive Grandpa's letters?","a":"Her father hid them all; she only found out many years later."},"words":[{"zh":"发","py":"fā","en":"to send (发来 = sent here)"},{"zh":"眼睛","py":"yǎnjing","en":"eyes"},{"zh":"收到","py":"shōudào","en":"to receive (messages, letters, gifts, or delivery)"},{"zh":"别的","py":"biéde","en":"other"}],"notes":[{"zh":"十几封没有打开的信","en":"a dozen or so unopened letters (十几 = ten-something)"},{"zh":"我一封信也没有收到","en":"I did not receive a single letter"},{"zh":"我爸爸让我认识了一个医生","en":"my father introduced me to a doctor"},{"zh":"是我爸爸把这些信都藏起来了","en":"it was my father who hid all these letters"}],"summary":{"qs":["安娜在盒子最下面找到了什么？","这些信是从哪里发来的？","那一年，奶奶收到信了吗？她觉得怎么样？","后来奶奶的爸爸让她认识了谁？","奶奶喜欢那个人吗？","为什么奶奶没有收到信？"],"limit":110,"model":"安娜在盒子的最下面找到了十几封没有打开的信，都是爷爷从新西兰发来的。那一年，奶奶一封信也没有收到，她觉得爷爷一定忘了她，每天晚上都哭。后来，她爸爸让她认识了一个很有钱的医生，可是她一点儿都不喜欢他。很多年以后，她才知道，是她爸爸把信都藏起来了。"},"diff":{"t":"不同 / 不一样","note":"Both mean different. 不一样 is used after the nouns (A和B不一样); 不同 can go before a noun (不同的国家) or after (A和B不同).","items":[{"s":"这里的星星和台湾的＿＿。","opts":["不一样","不同"],"a":"不一样"},{"s":"奶奶和我在＿＿的时间，有同样的问题。","opts":["不一样","不同"],"a":"不同"},{"s":"他们去过很多＿＿的国家。","opts":["不一样","不同"],"a":"不同"},{"s":"我的爱好和爸爸的＿＿。","opts":["不一样","不同"],"a":"不一样"}]},"mcq":[{"type":"理解","q":"没有打开的信有多少封？","opts":["两三封","一封","十几封","一百多封"],"a":2},{"type":"理解","q":"那一年奶奶觉得爷爷：","opts":["一定忘了她","回台湾了","没有钱","生病了"],"a":0},{"type":"理解","q":"奶奶的爸爸让她认识了：","opts":["一个邮差","一个工人","一个老师","一个医生"],"a":3},{"type":"理解","q":"谁把信藏起来了？","opts":["小兰","那个医生","奶奶的爸爸","奶奶的妈妈"],"a":2},{"type":"语法","q":"那一年，我一封信＿＿没有收到。","opts":["还","才","都是","也"],"a":3},{"type":"语法","q":"很多年以后，我＿＿知道。","opts":["再","又","才","就"],"a":2},{"type":"词汇","q":"“收到”的意思是：","opts":["to send","to hide","to receive","to collect"],"a":2},{"type":"词汇","q":"“别的女生”的意思是：","opts":["a sister","a strange girl","another girl","a different school"],"a":2}],"write":{"en":"Write about a misunderstanding between you and a friend or family member. How did you find out the truth?","zh":"写一写你和朋友的一个问题：你想的是什么？后来你才知道什么？","n":"80–100","model":"上个月，我给好朋友发了很多短信，可是她一个也没有回。我觉得她不想和我做朋友了，非常难过。后来我才知道，她的手机坏了，她一封短信也没有收到。我们见面的时候都笑了。"}}},{"id":8,"kind":"letter","title_zh":"我会在湖边等你","title_en":"I will wait for you by the lake","date":"1978年5月1日，新西兰","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"你已经一年没有给我写信了。我不知道为什么，可是我不相信你忘了我。这封信，我请你的好朋友小兰交给你。","en":"You haven't written to me for a year. I don't know why, but I don't believe you have forgotten me. I'm asking your good friend Xiaolan to give you this letter.","py":["nǐ","yǐ","jīng","yì","nián","méi","yǒu","gěi","wǒ","xiě","xìn","le","","wǒ","bù","zhī","dao","wèi","shén","me","","kě","shì","wǒ","bù","xiāng","xìn","nǐ","wàng","le","wǒ","","zhè","fēng","xìn","","wǒ","qǐng","nǐ","de","hǎo","péng","you","xiǎo","lán","jiāo","gěi","nǐ",""]},{"t":"letter","who":"爷爷","zh":"我两年的工作做完了，我也有了一些钱。五月十二日，我会回到台北。那天下午四点，我会在湖边的大树下面等你，就像我们第一次见面的时候。祝我好运吧！","en":"My two years of work are finished, and I have some money now. On the twelfth of May I will be back in Taipei. That afternoon at four, I will wait for you under the big tree by the lake — just like the first time we met. Wish me luck!","py":["wǒ","liǎng","nián","de","gōng","zuò","zuò","wán","le","","wǒ","yě","yǒu","le","yì","xiē","qián","","wǔ","yuè","shí","èr","rì","","wǒ","huì","huí","dào","tái","běi","","nà","tiān","xià","wǔ","sì","diǎn","","wǒ","huì","zài","hú","biān","de","dà","shù","xià","miàn","děng","nǐ","","jiù","xiàng","wǒ","men","dì","yī","cì","jiàn","miàn","de","shí","hou","","zhù","wǒ","hǎo","yùn","ba",""]},{"t":"letter","who":"爷爷","zh":"如果你不来，我会明白。我会离开，不会再给你写信了。","en":"If you don't come, I'll understand. I'll leave, and I won't write to you again.","py":["rú","guǒ","nǐ","bù","lái","","wǒ","huì","míng","bai","","wǒ","huì","lí","kāi","","bú","huì","zài","gěi","nǐ","xiě","xìn","le",""]},{"t":"letter","who":"爷爷","zh":"可是，如果你来，我会照顾你一辈子。","en":"But if you come, I will take care of you for the rest of my life.","py":["kě","shì","","rú","guǒ","nǐ","lái","","wǒ","huì","zhào","gù","nǐ","yí","bèi","zi",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"How does this letter reach Yue, and what is Hai's plan?","points":["He asks her good friend Xiaolan to give it to her.","His two years are finished and he has some money; back in Taipei on 12 May.","He'll wait under the big tree by the lake at 4 pm, like their first meeting."],"model":"Hai sends this letter through Yue's good friend Xiaolan. His two years of work are over and he has saved some money; on 12 May he will return to Taipei and wait for her at four o'clock under the big tree by the lake, just like their first meeting."},{"band":"E","q":"Why does Hai send this letter through Xiaolan, and how does the letter show his character has stayed the same?","points":["Implied: he suspects his letters aren't reaching her (a year of silence) so he avoids her family's address.","Same place and time (4 pm, the big tree) as his first letter — loyalty and romance.","Still respectful: if she doesn't come he'll understand, leave and not write again.","But more confident: promises to take care of her for life."],"model":"Hai sends the letter through Xiaolan because, after a year of silence, he suspects his letters are not reaching Yue — he refuses to believe she has forgotten him, so he goes around her family. The letter shows that he hasn't changed: he chooses the same place and time as his very first letter — four o'clock under the big tree — which is both loyal and romantic. He is still respectful, promising to understand, leave and never write again if she doesn't come. But he is also more confident now that he has kept his promise: if she comes, he will take care of her for the rest of his life."}],"title_py":"wǒ huì zài hú biān děng nǐ","exercises":{"match":[{"zh":"交给","en":"to hand over to"},{"zh":"回到","en":"to return to"},{"zh":"离开","en":"to leave"},{"zh":"照顾","en":"to look after"},{"zh":"一辈子","en":"a whole lifetime"},{"zh":"做完","en":"to finish (doing)"}],"opts":[0,4,5,2,3,1],"bank":["做完","一些","相信","交给","离开","照顾"],"fill":[{"s":"我的作业已经＿＿了。","a":"做完"},{"s":"请你把这封信＿＿老师。","a":"交给"},{"s":"妈妈生病了，我在家＿＿她。","a":"照顾"},{"s":"他明天就要＿＿新西兰了。","a":"离开"},{"s":"我不＿＿他忘了我。","a":"相信"}],"grammar":[{"t":"会 (promise, will)","p":"subject + 会 + verb","note":"会 + verb makes a promise or a prediction: “will”.","eg":"可是，如果你来，我会照顾你一辈子。","order":[{"w":["月","会","我","每个","写信","给","你"],"s":"我会每个月给你写信。","en":"I will write to you every month.","alt":[]},{"w":["下雨","吗","会","明天"],"s":"明天会下雨吗？","en":"Will it rain tomorrow?","alt":[]}],"make":[{"q":"Say: “I will wait for you by the lake.”","a":"我会在湖边等你。"}]},{"t":"不会再 … 了","p":"不会再 + verb + 了","note":"不会再 … 了 = “won’t … again / any more”.","eg":"我会离开，不会再给你写信了。","order":[{"w":["会","迟到","我","了","不","再"],"s":"我不会再迟到了。","en":"I won't be late again.","alt":[]},{"w":["走了","会","再","以后","不","了","他","回来"],"s":"他走了以后，不会再回来了。","en":"After he leaves, he won't come back again.","alt":[]}],"make":[{"q":"Say: “I won’t argue with Dad again.”","a":"我不会再和爸爸吵架了。"}]}]},"lesson":{"listen":{"q":"What does Grandpa say he will do on 12 May, and what if she doesn't come?","a":"Wait for her at 4 pm under the big tree by the lake; if she does not come, he will understand, leave, and never write again."},"words":[{"zh":"祝","py":"zhù","en":"to wish (eg, 祝你生日快乐)"},{"zh":"好运","py":"hǎoyùn","en":"good luck (eg, 祝你好运)"},{"zh":"离开","py":"líkāi","en":"to leave, to depart"},{"zh":"照顾","py":"zhàogù","en":"to take care of, to look after"}],"notes":[{"zh":"我请你的好朋友小兰交给你","en":"I’m asking your good friend Xiaolan to hand it to you"},{"zh":"我两年的工作做完了","en":"my two years of work are finished"},{"zh":"祝我好运吧","en":"wish me luck"},{"zh":"我会照顾你一辈子","en":"I will look after you all my life"}],"summary":{"qs":["月多长时间没有给爷爷写信了？爷爷相信她忘了他吗？","这封信是怎么到月手里的？","爷爷什么时候回台北？","他会在哪里等月？","如果月不来，他会做什么？","如果月来了呢？"],"limit":110,"model":"月已经一年没有给爷爷写信了，可是爷爷不相信她忘了他。他请月的好朋友小兰把这封信交给她。爷爷两年的工作做完了，五月十二日他会回到台北，下午四点在湖边的大树下面等月。如果她不来，他会离开，不会再写信了。如果她来，他会照顾她一辈子。"},"diff":{"t":"一直 / 从来","note":"一直 = all along, continuously (我一直在等你). 从来 + 不/没 = never, ever (我从来没有忘了你). 从来 is almost always negative.","items":[{"s":"奶奶＿＿不知道爷爷写了那么多信。 (all along)","opts":["一直","从来"],"a":"一直"},{"s":"爸爸＿＿不关心我喜欢什么。 (never)","opts":["一直","从来"],"a":"从来"},{"s":"他＿＿在大树下面等。 (the whole time)","opts":["一直","从来"],"a":"一直"},{"s":"我＿＿没有去过台湾。 (never)","opts":["一直","从来"],"a":"从来"}]},"mcq":[{"type":"理解","q":"这封信是谁交给月的？","opts":["邮差","安娜","小兰","月的爸爸"],"a":2},{"type":"理解","q":"爷爷几号回台北？","opts":["四月十二日","五月二日","十二月五日","五月十二日"],"a":3},{"type":"理解","q":"爷爷在新西兰工作了多长时间？","opts":["一年","十年","三个月","两年"],"a":3},{"type":"理解","q":"如果月不来，爷爷会：","opts":["离开，不再写信","去找她的爸爸","一直等","回新西兰工作"],"a":0},{"type":"语法","q":"如果你不来，我会离开，不会＿＿给你写信了。","opts":["还","又","再","也"],"a":2},{"type":"语法","q":"这封信，我请你的好朋友小兰交＿＿你。","opts":["给","对","和","到"],"a":0},{"type":"词汇","q":"“好运”的意思是：","opts":["good weather","good transport","good luck","good exercise"],"a":2},{"type":"词汇","q":"“一辈子”的意思是：","opts":["one generation","a whole lifetime","a moment","one year"],"a":1}],"write":{"en":"Write an important message to someone: say what has happened, what you will do, and what you hope they will do.","zh":"给一个人写一封很重要的信：发生了什么？你会做什么？你想他/她做什么？","n":"80–100","model":"小兰：我已经半年没有收到你的信了，可是我不相信你忘了我。下个月十号，我会回到奥克兰。那天下午三点，我会在我们学校门口等你。如果你不来，我会明白。如果你来，我会把这半年的故事都讲给你听。祝我好运吧！"}}},{"id":9,"kind":"now","title_zh":"那天的雨","title_en":"The rain that day","blocks":[{"t":"say","who":"安娜","zh":"“奶奶，五月十二日，你去湖边了吗？”","en":"\"Grandma, on the twelfth of May — did you go to the lake?\"","py":["","nǎi","nai","","wǔ","yuè","shí","èr","rì","","nǐ","qù","hú","biān","le","ma","",""]},{"t":"say","who":"奶奶","zh":"“那天下了很大的雨。我爸爸不让我出门，我一直在窗户旁边哭。到了晚上九点，雨还在下。我想，他一定已经走了。”","en":"\"It rained heavily that day. My father wouldn't let me go out, and I cried by the window the whole time. By nine at night it was still raining. I thought he must have gone.\"","py":["","nà","tiān","xià","le","hěn","dà","de","yǔ","","wǒ","bà","ba","bú","ràng","wǒ","chū","mén","","wǒ","yì","zhí","zài","chuāng","hu","páng","biān","kū","","dào","le","wǎn","shang","jiǔ","diǎn","","yǔ","hái","zài","xià","","wǒ","xiǎng","","tā","yí","dìng","yǐ","jīng","zǒu","le","",""]},{"t":"say","who":"奶奶","zh":"“可是，我爸爸自己带了雨伞去了湖边。他看到你爷爷一个人站在大树下面，衣服都湿了，可是他还在等。”","en":"\"But my father took an umbrella and went to the lake himself. He saw your grandfather standing alone under the big tree, his clothes soaking wet — and still waiting.\"","py":["","kě","shì","","wǒ","bà","ba","zì","jǐ","dài","le","yǔ","sǎn","qù","le","hú","biān","","tā","kàn","dào","nǐ","yé","ye","yí","gè","rén","zhàn","zài","dà","shù","xià","miàn","","yī","fu","dōu","shī","le","","kě","shì","tā","hái","zài","děng","",""]},{"t":"say","who":"奶奶","zh":"“我爸爸问他：‘你等了多久？’他说：‘从下午四点到现在。如果她今天不来，我明天还来。’”","en":"\"My father asked him, 'How long have you been waiting?' He said, 'Since four this afternoon. If she doesn't come today, I'll come back tomorrow.'\"","py":["","wǒ","bà","ba","wèn","tā","","","nǐ","děng","le","duō","jiǔ","","","tā","shuō","","","cóng","xià","wǔ","sì","diǎn","dào","xiàn","zài","","rú","guǒ","tā","jīn","tiān","bù","lái","","wǒ","míng","tiān","hái","lái","","",""]},{"t":"p","zh":"奶奶说，那天晚上，她爸爸带爷爷回了家。他对奶奶说：“这个年轻人，可以相信。”一年以后，奶奶和爷爷结婚了，后来一起来到了新西兰。新西兰成为了他们的第二个家乡。","en":"Grandma said that night her father brought Grandpa home. He said to Grandma, \"This young man can be trusted.\" A year later, Grandma and Grandpa got married, and later they came to New Zealand together. New Zealand became their second home.","py":["nǎi","nai","shuō","","nà","tiān","wǎn","shang","","tā","bà","ba","dài","yé","ye","huí","le","jiā","","tā","duì","nǎi","nai","shuō","","","zhè","ge","nián","qīng","rén","","kě","yǐ","xiāng","xìn","","","yì","nián","yǐ","hòu","","nǎi","nai","hé","yé","ye","jié","hūn","le","","hòu","lái","yì","qǐ","lái","dào","le","xīn","xī","lán","","xīn","xī","lán","chéng","wéi","le","tā","men","de","dì","èr","gè","jiā","xiāng",""]},{"t":"p","zh":"我明白了：奶奶的爸爸不是不爱她。他只是怕她以后过得不好。","en":"I understood now: Grandma's father did love her. He was just afraid she wouldn't have a good life.","py":["wǒ","míng","bai","le","","nǎi","nai","de","bà","ba","bú","shì","bú","ài","tā","","tā","zhǐ","shì","pà","tā","yǐ","hòu","guò","de","bù","hǎo",""]}],"questions":[{"band":"A","q":"What happened on 12 May?","points":["It rained heavily; her father wouldn't let her go out; she cried by the window.","At 9 pm her father took an umbrella to the lake himself.","Hai was standing alone under the tree, soaking wet, still waiting since 4 pm, ready to return tomorrow.","Her father brought him home: 'This young man can be trusted.' They married a year later and moved to NZ."],"model":"It rained heavily and Grandma's father wouldn't let her out, so she cried by the window, sure Hai had left. But at nine o'clock her father went to the lake himself with an umbrella and found Hai alone under the tree, soaking wet and still waiting since four; he said he would come back tomorrow if she didn't come. Her father brought him home and said he could be trusted. They married a year later and moved to New Zealand."},{"band":"E","q":"Why does Grandma's father change his mind, and what does Ana learn from this?","points":["Hai's patience and commitment (waiting five hours in heavy rain, will return tomorrow) prove he is reliable — 'can be trusted'.","Her father went himself — implies he was already uncertain / softening.","Ana learns her great-grandfather wasn't unloving; he was afraid for his daughter's future — so Dad's opposition may also be fear, not lack of love."],"model":"Grandma's father changes his mind because Hai proves his character: he waited from four in the afternoon until nine at night in heavy rain and said he would come back the next day. That patience shows he is reliable, so the father says 'this young man can be trusted'. The fact that the father went to the lake himself suggests he was already beginning to doubt his own decision. Ana learns that her great-grandfather wasn't unloving — he was afraid his daughter would have a hard life — which helps her understand that her own dad's opposition may also come from fear for her future rather than a lack of love."}],"title_py":"nà tiān de yǔ","exercises":{"match":[{"zh":"出门","en":"to go out"},{"zh":"结婚","en":"to marry"},{"zh":"年轻人","en":"young person"},{"zh":"雨伞","en":"umbrella"},{"zh":"自己","en":"oneself"},{"zh":"湿","en":"wet"}],"opts":[4,2,5,0,1,3],"bank":["出门","结婚","已经","久","雨伞","自己"],"fill":[{"s":"下雨了，别忘了带＿＿。","a":"雨伞"},{"s":"我哥哥明年要＿＿了。","a":"结婚"},{"s":"今天太冷了，我不想＿＿。","a":"出门"},{"s":"他＿＿走了，你来晚了。","a":"已经"},{"s":"这件事情我想＿＿做。","a":"自己"}],"grammar":[{"t":"从 … 到 …","p":"从 + start + 到 + end","note":"从 … 到 … = from … to … (time or place).","eg":"从下午四点到现在。","order":[{"w":["八点","到","下午","从","我","三点","早上","上课"],"s":"我从早上八点到下午三点上课。","en":"I'm in class from 8 in the morning to 3 in the afternoon.","alt":[]},{"w":["分钟","学校","要","我家","从","到","二十"],"s":"从我家到学校要二十分钟。","en":"It takes twenty minutes from my home to school.","alt":[]}],"make":[{"q":"Say: “He waited from four in the afternoon to nine at night.”","a":"他从下午四点等到晚上九点。"}]},{"t":"不是不 …，只是 …","p":"不是不 + verb，只是 + real reason","note":"不是不 … = “it’s not that … doesn’t …”. 只是 then gives the real reason.","eg":"奶奶的爸爸不是不爱她。他只是怕她以后过得不好。","order":[{"w":["不","了","忙","我","只是","太","想","去","不是"],"s":"我不是不想去，只是太忙了。","en":"It's not that I don't want to go; I'm just too busy.","alt":[]},{"w":["不是","只是","爱","你","了","不","爸爸","他","太","忙"],"s":"爸爸不是不爱你，他只是太忙了。","en":"It's not that Dad doesn't love you; he's just too busy.","alt":[]}],"make":[{"q":"Say: “It’s not that I don’t like maths; I just like photography more.”","a":"我不是不喜欢数学，只是更喜欢摄影。"}]}]},"lesson":{"listen":{"q":"Who went to the lake in the rain, and what did he find?","a":"Grandma's father went himself with an umbrella; he found Grandpa alone under the tree, soaked, still waiting since four o'clock."},"words":[{"zh":"成为","py":"chéngwéi","en":"to become"}],"notes":[{"zh":"我爸爸不让我出门","en":"my father wouldn't let me go out"},{"zh":"雨还在下","en":"it was still raining"},{"zh":"从下午四点到现在","en":"from four in the afternoon until now"},{"zh":"这个年轻人，可以相信","en":"this young man can be trusted"}],"summary":{"qs":["五月十二日天气怎么样？奶奶去湖边了吗？为什么？","晚上九点，奶奶想什么？","谁去了湖边？他看到了什么？","爷爷说他等了多久？","奶奶的爸爸那天晚上说了什么？","后来奶奶和爷爷怎么样？"],"limit":120,"model":"五月十二日下了很大的雨，奶奶的爸爸不让她出门，她在窗户旁边哭。晚上九点，她想爷爷一定已经走了。可是她爸爸自己带了雨伞去了湖边，看到爷爷一个人站在大树下面，衣服都湿了，还在等。爷爷说他从下午四点一直等到现在。那天晚上，她爸爸说：“这个年轻人，可以相信。”一年以后，他们结婚了，后来新西兰成为了他们的第二个家乡。"},"diff":{"t":"当 / 当然","note":"当 = to work as / be (当医生, 当工作). 当然 = of course.","items":[{"s":"摄影以后能＿＿工作吗？","opts":["当","当然"],"a":"当"},{"s":"你＿＿可以参加比赛。","opts":["当","当然"],"a":"当然"},{"s":"我以后想＿＿一个医生。","opts":["当","当然"],"a":"当"},{"s":"“你爱我吗？”“＿＿！”","opts":["当","当然"],"a":"当然"}]},"mcq":[{"type":"理解","q":"那天奶奶在哪里？","opts":["在医院","在码头","在湖边","在窗户旁边哭"],"a":3},{"type":"理解","q":"谁去了湖边？","opts":["那个医生","奶奶","奶奶的爸爸","小兰"],"a":2},{"type":"理解","q":"爷爷的衣服怎么样？","opts":["很新","都湿了","是白色的","很干净"],"a":1},{"type":"理解","q":"奶奶的爸爸为什么同意了？","opts":["爷爷很有钱","他看到爷爷在大雨里等了很久，觉得可以相信他","奶奶一直哭","小兰告诉了他"],"a":1},{"type":"语法","q":"他＿＿下午四点等到晚上九点。","opts":["从","在","离","到"],"a":0},{"type":"语法","q":"奶奶的爸爸不是＿＿爱她，他只是怕她以后过得不好。","opts":["没","不","很","也"],"a":1},{"type":"词汇","q":"“成为”的意思是：","opts":["to become","to be called","to succeed","to turn back"],"a":0},{"type":"词汇","q":"“结婚”的意思是：","opts":["to meet","to marry","to finish","to promise"],"a":1}],"write":{"en":"Write about someone who changed their mind about something important. What made them change?","zh":"写一写一个人对一个重要的问题，以前和现在想的不一样。为什么？","n":"80–100","model":"我哥哥以前不同意我学中文。他认为中文太难了，学了也没有用。去年他去上海工作，发现会说中文的人有很多机会。现在他每天都和我一起学中文，他说：“我以前想的不对！”"}}},{"id":10,"kind":"now","title_zh":"一张照片","title_en":"A photograph","blocks":[{"t":"p","zh":"星期天早上，我去找爸爸。这一次，我没有生气，也没有哭。","en":"On Sunday morning I went to find Dad. This time I wasn't angry, and I didn't cry.","py":["xīng","qī","tiān","zǎo","shàng","","wǒ","qù","zhǎo","bà","ba","","zhè","yí","cì","","wǒ","méi","yǒu","shēng","qì","","yě","méi","yǒu","kū",""]},{"t":"say","who":"安娜","zh":"“爸爸，你知道吗？奶奶的爸爸以前也不同意她和爷爷在一起。”","en":"\"Dad, did you know? Grandma's father didn't approve of her being with Grandpa either.\"","py":["","bà","ba","","nǐ","zhī","dao","ma","","nǎi","nai","de","bà","ba","yǐ","qián","yě","bù","tóng","yì","tā","hé","yé","ye","zài","yì","qǐ","",""]},{"t":"p","zh":"我给爸爸看了爷爷的信。爸爸看了很久，没有说话。最后，他说：","en":"I showed Dad Grandpa's letters. Dad read them for a long time without saying anything. Finally he said:","py":["wǒ","gěi","bà","ba","kàn","le","yé","ye","de","xìn","","bà","ba","kàn","le","hěn","jiǔ","","méi","yǒu","shuō","huà","","zuì","hòu","","tā","shuō",""]},{"t":"say","who":"爸爸","zh":"“我以前也没看过这些信……原来我的爸爸妈妈也这么不容易。我很感动。”","en":"\"I've never read these letters before… So my parents had it hard too.\" I'm very moved.","py":["","wǒ","yǐ","qián","yě","méi","kàn","guò","zhè","xiē","xìn","","","yuán","lái","wǒ","de","bà","ba","mā","ma","yě","zhè","me","bù","róng","yì","","wǒ","hěn","gǎn","dòng","",""]},{"t":"say","who":"安娜","zh":"“我想参加摄影比赛，不是因为我不想学习。我想用照片记下奶奶的故事。”","en":"\"I want to enter the photography competition, not because I don't want to study. I want to use photos to record Grandma's story.\"","py":["","wǒ","xiǎng","cān","jiā","shè","yǐng","bǐ","sài","","bú","shì","yīn","wèi","wǒ","bù","xiǎng","xué","xí","","wǒ","xiǎng","yòng","zhào","piàn","jì","xià","nǎi","nai","de","gù","shì","",""]},{"t":"p","zh":"爸爸想了一会儿，笑了。","en":"Dad thought for a moment, then smiled.","py":["bà","ba","xiǎng","le","yí","huì","r","","xiào","le",""]},{"t":"say","who":"爸爸","zh":"“好吧，你当然可以参加比赛。可是你也要好好复习数学，好吗？”","en":"\"All right — of course you can enter the competition. But you also have to revise your maths properly, OK?\"","py":["","hǎo","ba","","nǐ","dāng","rán","kě","yǐ","cān","jiā","bǐ","sài","","kě","shì","nǐ","yě","yào","hǎo","hǎo","fù","xí","shù","xué","","hǎo","ma","",""]},{"t":"p","zh":"那天下午，我给奶奶照相。她坐在窗户旁边，手里有爷爷的第一封信，笑得像一个年轻的女生。这张照片的名字是《等》。","en":"That afternoon I took photos of Grandma. She sat by the window holding Grandpa's first letter, smiling like a young girl. I called the photo 'Waiting'.","py":["nà","tiān","xià","wǔ","","wǒ","gěi","nǎi","nai","zhào","xiàng","","tā","zuò","zài","chuāng","hu","páng","biān","","shǒu","lǐ","yǒu","yé","ye","de","dì","yī","fēng","xìn","","xiào","de","xiàng","yí","gè","nián","qīng","de","nǚ","shēng","","zhè","zhāng","zhào","piàn","de","míng","zi","shì","","děng","",""]},{"t":"p","zh":"奶奶对我说：","en":"Grandma said to me:","py":["nǎi","nai","duì","wǒ","shuō",""]},{"t":"say","who":"奶奶","zh":"“爱一个人，要有勇气，也要有耐心。”","en":"\"To love someone, you need courage — and you need patience.\"","py":["","ài","yí","gè","rén","","yào","yǒu","yǒng","qì","","yě","yào","yǒu","nài","xīn","",""]}],"questions":[{"band":"A","q":"How do Ana and her dad solve their problem?","points":["Ana talks to Dad calmly and shows him Grandpa's letters.","She explains she wants to record Grandma's story with photos — not avoid studying.","Dad agrees she can enter, if she also revises maths properly."],"model":"Ana talks to Dad calmly, without anger or tears, and shows him Grandpa's letters. She explains that she wants to enter the competition to record Grandma's story in photos, not to avoid studying. Dad agrees she can enter as long as she also revises maths properly."},{"band":"E","q":"What does Grandma mean by 'To love someone, you need courage — and you need patience'? Explain how it applies to both Grandma's story and Ana's.","points":["Courage: Hai left home for NZ; Grandma loved a poor postman; Ana speaks to Dad again.","Patience: Hai waited two years and in the rain; Ana waits until she is calm instead of shouting.","Ana's photo 'Waiting' (《等》) links the two stories — waiting = patience rewarded.","Dad also changes: he sees his parents' hardship (这么不容易) and compromises."],"model":"Grandma means that real love needs both the courage to act and the patience to wait. In her story, Hai showed courage by leaving home to work in New Zealand and Grandma by loving a poor postman against her father's wishes; Hai showed patience by working for two years and waiting in the rain until he was trusted. Ana follows the same path: she has the courage to raise the competition again, but this time patiently and calmly, using the letters to help Dad understand. Dad responds by seeing how hard things were for his own parents and offering a compromise. Ana's photo is even called 'Waiting' (《等》), linking her photograph, Grandpa's long wait and her own patient approach."}],"title_py":"yì zhāng zhào piàn","exercises":{"match":[{"zh":"以前","en":"before, in the past"},{"zh":"容易","en":"easy"},{"zh":"记下","en":"to record, write down"},{"zh":"好好","en":"properly, well"},{"zh":"勇气","en":"courage"},{"zh":"耐心","en":"patience"}],"opts":[5,2,0,4,1,3],"bank":["名字","耐心","以前","容易","好好","勇气"],"fill":[{"s":"我＿＿住在台湾，现在住在新西兰。","a":"以前"},{"s":"学好汉语不＿＿，要多练习。","a":"容易"},{"s":"明天有考试，今天要＿＿复习。","a":"好好"},{"s":"教小孩子要有＿＿。","a":"耐心"},{"s":"他很有＿＿，一个人去了别的国家。","a":"勇气"}],"grammar":[{"t":"不是因为 …，是因为 …","p":"不是因为 + wrong reason，是因为 + real reason","note":"Use this to correct a wrong idea about WHY: “not because …, but because …”.","eg":"我想参加摄影比赛，不是因为我不想学习。","order":[{"w":["高兴","我","哭","是","太","难过","因为","不是","因为","了"],"s":"我哭不是因为难过，是因为太高兴了。","en":"I'm crying not because I'm sad, but because I'm so happy.","alt":[]},{"w":["喜欢","中国","不是","他","汉语","因为","学","是","他","爸爸","文化","因为"],"s":"他学汉语不是因为爸爸，是因为他喜欢中国文化。","en":"He learns Chinese not because of his dad, but because he likes Chinese culture.","alt":[]}],"make":[{"q":"Say: “I came to New Zealand not because of money, but because of you.”","a":"我来新西兰不是因为钱，是因为你。"}]},{"t":"用 + thing + verb","p":"用 + tool / way + verb","note":"用 + something + verb = to do something WITH / IN something.","eg":"我想用照片记下奶奶的故事。","order":[{"w":["想","我","用","写","一封","汉语","信"],"s":"我想用汉语写一封信。","en":"I want to write a letter in Chinese.","alt":[]},{"w":["照片","用","手机","她","照了","很多"],"s":"她用手机照了很多照片。","en":"She took lots of photos with her phone.","alt":[]}],"make":[{"q":"Say: “Grandpa wrote a poem with a pen.”","a":"爷爷用笔写了一首诗。"}]}]},"lesson":{"listen":{"q":"Why does Ana want to enter the competition, and what does her photo show?","a":"Not because she doesn’t want to study, but to record Grandma’s story in photos; the photo, called “Waiting”, shows Grandma by the window holding Grandpa’s first letter, smiling like a young girl."},"words":[{"zh":"感动","py":"gǎndòng","en":"to be moved, to be touched"},{"zh":"记","py":"jì","en":"to record, write down (记下)"},{"zh":"当然","py":"dāngrán","en":"of course"},{"zh":"照相","py":"zhàoxiàng","en":"to take a photo"}],"notes":[{"zh":"这一次，我没有生气，也没有哭","en":"this time I didn't get angry or cry"},{"zh":"原来我的爸爸妈妈也这么不容易","en":"so my parents also had such a hard time"},{"zh":"我想用照片记下奶奶的故事","en":"I want to record Grandma’s story in photos"},{"zh":"爱一个人，要有勇气，也要有耐心","en":"loving someone takes courage and patience"}],"summary":{"qs":["星期天早上，安娜去找谁？她这一次怎么样？","她告诉爸爸什么？给爸爸看了什么？","爸爸看了信以后说了什么？","安娜为什么想参加摄影比赛？","爸爸同意了吗？他说了什么？","安娜的照片叫什么？上面有什么？"],"limit":120,"model":"星期天早上，安娜去找爸爸，这一次她没有生气，也没有哭。她告诉爸爸，奶奶的爸爸以前也不同意奶奶和爷爷在一起，还给爸爸看了爷爷的信。爸爸很感动，说原来他的爸爸妈妈也这么不容易。安娜说她想用照片记下奶奶的故事。爸爸同意了，可是她也要好好复习数学。她的照片叫《等》，上面是手里有第一封信的奶奶。"},"diff":{"t":"才 / 就","note":"就 = sooner/easier than expected (二十分钟就到了). 才 = later/harder than expected (很多年以后我才知道). After 才 there is no 了.","items":[{"s":"很多年以后，我＿＿知道。","opts":["才","就"],"a":"才"},{"s":"奶奶看了照片，脸很快＿＿红了。","opts":["才","就"],"a":"就"},{"s":"他晚上九点＿＿回家。 (late)","opts":["才","就"],"a":"才"},{"s":"我五分钟＿＿到了。 (quick)","opts":["才","就"],"a":"就"}]},"mcq":[{"type":"理解","q":"这一次去找爸爸，安娜：","opts":["哭了","很生气","没有生气，也没有哭","没有说话"],"a":2},{"type":"理解","q":"爸爸以前看过这些信吗？","opts":["看过一封","看过","我们不知道","没有"],"a":3},{"type":"理解","q":"爸爸看了信以后觉得怎么样？","opts":["很生气","很累","很失望","很感动"],"a":3},{"type":"理解","q":"安娜的照片名字是：","opts":["《湖边》","《信》","《等》","《奶奶》"],"a":2},{"type":"语法","q":"我想参加比赛，不是因为我不想学习。我想＿＿照片记下奶奶的故事。","opts":["用","给","把","让"],"a":0},{"type":"语法","q":"好吧，你＿＿可以参加比赛。","opts":["当然","当","一定","原来"],"a":0},{"type":"词汇","q":"“感动”的意思是：","opts":["to move house","to be excited","to feel sick","to be moved, touched"],"a":3},{"type":"词汇","q":"“勇气”的意思是：","opts":["patience","confidence","courage","luck"],"a":2}],"write":{"en":"Grandma says love needs courage and patience. Do you agree? Give an example from the story and from your own life.","zh":"奶奶说：“爱一个人，要有勇气，也要有耐心。”你同意吗？请用故事和你自己的生活说一说。","n":"100–120","model":"我同意奶奶的话。在故事里，爷爷很有勇气：他是一个邮差，可是他给月写了信。他也很有耐心：他在新西兰工作了两年，在大雨里等了五个小时。我的爸爸妈妈也一样，他们常常和我吵架，可是他们一直照顾我。"}}}],"glossary":[{"zh":"摄影","py":"shèyǐng","en":"photography"},{"zh":"情书","py":"qíngshū","en":"love letter"},{"zh":"信","py":"xìn","en":"letter (一封信 = one letter)"},{"zh":"搬家","py":"bānjiā","en":"to move house"},{"zh":"盒子","py":"hézi","en":"box"},{"zh":"旧","py":"jiù","en":"old (not new) — Level 3 word"},{"zh":"脸","py":"liǎn","en":"face"},{"zh":"邮差","py":"yóuchāi","en":"postman"},{"zh":"码头","py":"mǎtóu","en":"harbour, wharf"},{"zh":"农场","py":"nóngchǎng","en":"farm"},{"zh":"诗","py":"shī","en":"poem"},{"zh":"心","py":"xīn","en":"heart"},{"zh":"藏起来","py":"cáng qǐlai","en":"to hide (away)"},{"zh":"一辈子","py":"yíbèizi","en":"a whole lifetime"},{"zh":"雨伞","py":"yǔsǎn","en":"umbrella"},{"zh":"湿","py":"shī","en":"wet"},{"zh":"结婚","py":"jiéhūn","en":"to marry"},{"zh":"勇气","py":"yǒngqì","en":"courage"},{"zh":"耐心","py":"nàixīn","en":"patience"},{"zh":"吵架","py":"chǎojià","en":"to argue"},{"zh":"想到","py":"xiǎngdào","en":"to think of — Level 3 word"}],"title_py":"nǎi nai de qíng shū","tagline":"A box of old love letters, a postman by the lake, and a promise kept in the rain.","labels":{"letter":"A letter","letter_short":"Letter","icon":"✉","speakers":{"安娜":"ANA 安娜"}},"blurb":"Ana finds a red box of old love letters in her grandmother's room. As she reads them, a 1970s love story between a Taipei postman and a girl by the lake unfolds — and helps Ana face her own father.","cover":{"art":"dusk","quote_zh":"你在北半球看月亮，\n我在南半球想你。\n月亮只有一个，\n就像我的心，只给你。","quote_en":"You watch the moon in the north; I miss you in the south. There is only one moon — like my heart, it is only for you."},"unit_test":{"title_zh":"模拟考试 · 三篇文章","title_en":"Unit test · Mock exam: three texts","intro":"This test is set out like an NCEA Level 2 reading paper (91111): three texts, each with an Achievement, a Merit and an Excellence question. Answer in English, Chinese or te reo Māori, using evidence from the texts. Time: 60 minutes.","text":["TEXT A：博客文章 (Blog post) · 我的摄影比赛","我的摄影比赛（安娜的博客）","上个月，我参加了学校的摄影比赛。比赛的名字是“我的家人”。我给奶奶照了一张照片，叫《等》。照片上，奶奶坐在窗户旁边，手里有一封很旧的信，她笑得像一个年轻的女生。","比赛以前，我爸爸不同意我参加。他认为摄影没有用，我应该多复习数学。我们吵架了，我非常失望。后来，我给他看了爷爷和奶奶的情书，他才明白：每个人都有自己喜欢的东西。","上个星期五，校长告诉我，我的照片得了第一名！我可以去惠灵顿学习摄影一个星期。爸爸听了以后，比我还高兴。他说：“对不起，以前我不太关心你喜欢什么。”下个月，我就要去惠灵顿了，我想在那里照很多照片。","这次比赛让我明白了，照片不只是好看的东西，它也可以讲一个人的故事。奶奶的照片讲的是她和爷爷的故事，也讲了她等了很多年的心。","奶奶说，她要把这张照片放在爷爷的照片旁边。现在，我的数学成绩也不错，因为爸爸每天晚上都帮我复习。爸爸还说，下次比赛，他也想看我的照片。","TEXT B：电子邮件 (Email) · 给寄宿家庭的信","王叔叔、王阿姨：","你们好！我叫Sophie，今年十六岁，是惠灵顿的一个高中生。下个月，我要去上海做三个月的交换生，住在你们家。我会在十月三号坐飞机到上海。我非常高兴，也有一点儿紧张。","我先介绍一下我自己。我家有四个人：爸爸、妈妈、弟弟和我。我学中文已经三年了，可是我的中文还不太好，常常听不懂别人说话，所以请你们说得慢一点儿。我喜欢照相、游泳和做饭，也很想学做中国菜。我想在上海照很多照片，回新西兰以后给我的同学们看。我会做新西兰的一种甜点，到了上海，我想做给你们吃。","我有几个问题想问你们。第一，上海的冬天冷不冷？我应该带什么衣服？第二，你们家附近有没有游泳的地方？第三，听说你们的女儿小雪也十六岁，她喜欢做什么？我希望我们可以成为好朋友。","我妈妈让我问你们，你们喜欢什么礼物？她想给你们带一些新西兰的东西。我爸爸妈妈也想跟你们说谢谢，谢谢你们让我住在你们家。","谢谢你们！希望很快见到你们。","Sophie","TEXT C：两个租房广告 (Two rental listings) · 大学附近的房间","第一个房间：在大学旁边","一个房间，离大学走路只要五分钟。房间很小，可是很新，有一张床、一张桌子和一个衣柜。房子里一共住四个学生，大家一起用厨房和洗手间。每个星期一百八十块，包括水电和上网。不能养宠物。房子后面有一个小花园，周末可以在那里看书。附近有超市和图书馆，买东西很方便。现在住在那里的学生都是大学一年级的，大家常常一起做饭。如果你喜欢一个人住，可能会觉得人太多。每个人最少要住六个月。","第二个房间：在海边","一个很大的房间，有自己的洗手间，窗户外边就是大海，非常漂亮。房子里住两个老人和一个学生。房东每天给你做晚饭，周末还会带你去附近玩儿。每个星期两百五十块，包括晚饭、水电和上网。离大学有一点儿远，坐公共汽车要二十五分钟，可是公共汽车站就在门口。房东以前是中学老师，他们很喜欢跟年轻人聊天，也可以帮你练习英文。可是晚上十点以后不能请朋友来家里。"],"gloss":[{"zh":"第一名","py":"dì yī míng","en":"first place"},{"zh":"吵架","py":"chǎojià","en":"to argue"},{"zh":"博客","py":"bókè","en":"blog"},{"zh":"寄宿家庭","py":"jìsù jiātíng","en":"host family"},{"zh":"交换生","py":"jiāohuànshēng","en":"exchange student"},{"zh":"甜点","py":"tiándiǎn","en":"dessert"},{"zh":"紧张","py":"jǐnzhāng","en":"nervous"},{"zh":"床","py":"chuáng","en":"bed"},{"zh":"厨房","py":"chúfáng","en":"kitchen"},{"zh":"养","py":"yǎng","en":"to keep (a pet)"},{"zh":"租房","py":"zū fáng","en":"to rent a room"},{"zh":"衣柜","py":"yīguì","en":"wardrobe"},{"zh":"包括","py":"bāokuò","en":"to include"},{"zh":"宠物","py":"chǒngwù","en":"pet"},{"zh":"房东","py":"fángdōng","en":"landlord"}],"allow":["安娜","Tom","小云","小明","小兰","奥克兰","Sophie","王叔叔","王阿姨","小雪","惠灵顿","上海","博客文章","电子邮件","两个租房广告"],"questions":[{"band":"A","q":"TEXT A — What was the competition, and what was Ana's photo?","points":["School photography competition called “My family”.","Her photo “Waiting”: Grandma by the window holding a very old letter, smiling like a young girl."]},{"band":"M","q":"TEXT A — Why did Ana's father not want her to enter at first, and what changed his mind?","points":["He thought photography was useless and she should revise maths.","They argued; she was disappointed.","She showed him the love letters — he understood everyone has something they love."]},{"band":"E","q":"TEXT A — How has the relationship between Ana and her father changed? Use evidence.","points":["Before: conflict — he did not care what she liked; argument; disappointment.","After winning: he is happier than she is and apologises for not caring before.","Now he helps her revise maths every evening and her marks are good — mutual support; both sides compromised."]},{"band":"A","q":"TEXT B — Who is Sophie and why is she writing?","points":["16-year-old high-school student from Wellington.","Going to Shanghai for a three-month exchange and will live with the Wang family."]},{"band":"M","q":"TEXT B — What does Sophie tell the Wangs about herself, and what does she ask them?","points":["Family of four; learning Chinese for three years but not good yet — please speak slowly; likes photography, swimming, cooking; will make a NZ dessert.","Asks: Shanghai winter / what clothes; swimming pool nearby; what daughter Xiaoxue likes; what gift they’d like."]},{"band":"E","q":"TEXT B — How does Sophie's email show she wants to make a good start with her host family? Use evidence.","points":["Polite and warm greeting and closing; honest about her Chinese level.","Offers something: cooking a NZ dessert; her mum wants to bring gifts.","Shows interest in their lives (daughter, hopes to be friends) and prepares carefully (clothes, swimming) — positive, considerate."]},{"band":"A","q":"TEXT C — Describe the room next to the university.","points":["5 minutes’ walk to university; small but new; bed, desk, wardrobe.","Four students share kitchen and bathroom; $180/week incl. power, water, internet; no pets; small garden; supermarket and library nearby; first-year students who often cook together; may feel crowded if you like living alone."]},{"band":"M","q":"TEXT C — What extra things does the room by the sea offer, and what are its disadvantages?","points":["Big room, own bathroom, sea view; older couple cook dinner daily and take you out at weekends; $250 incl. dinner; landlords are former teachers who can help with English.","Disadvantages: more expensive; 25 minutes by bus to university (though bus stop at the door); no friends over after 10 pm."]},{"band":"E","q":"TEXT C — Which room would better suit a first-year international student? Justify your choice using details from both listings.","points":["Room 1: cheap, close, independent, other students — good for friends and saving money, but must cook and share.","Room 2: dinner and a family atmosphere, help settling in, practice language — but costlier and further away.","Any justified choice weighing cost, distance, food, company."]}],"mcq":[{"type":"理解","q":"TEXT A：比赛的名字是：","opts":["我的家人","我的家乡","我的学校","等"],"a":0},{"type":"理解","q":"TEXT A：爸爸以前认为摄影：","opts":["没有用","很有意思","很贵","很难"],"a":0},{"type":"理解","q":"TEXT A：谁告诉安娜她得了第一名？","opts":["校长","老师","奶奶","爸爸"],"a":0},{"type":"理解","q":"TEXT A：安娜可以去哪里学习摄影？","opts":["台北","北京","奥克兰","惠灵顿"],"a":3},{"type":"理解","q":"TEXT A：为什么安娜的数学成绩也不错？","opts":["她不参加比赛了","她找了老师","奶奶教她","爸爸每天晚上帮她复习"],"a":3},{"type":"语法","q":"TEXT A：她给爸爸看了情书以后，爸爸＿＿明白。","opts":["又","才","就","再"],"a":1},{"type":"语法","q":"TEXT A：爸爸听了以后，＿＿我还高兴。","opts":["和","像","比","跟"],"a":2},{"type":"语法","q":"TEXT A：奶奶要＿＿这张照片放在爷爷的照片旁边。","opts":["让","对","把","给"],"a":2},{"type":"词汇","q":"TEXT A：“校长”是：","opts":["class teacher","headmaster’s office","school leader of students","school principal"],"a":3},{"type":"词汇","q":"TEXT A：“成绩”的意思是：","opts":["marks, results","homework","exam","success"],"a":0},{"type":"理解","q":"TEXT B：Sophie要在上海住多长时间？","opts":["三个月","一个月","三年","六个月"],"a":0},{"type":"理解","q":"TEXT B：Sophie为什么请王叔叔王阿姨说得慢一点儿？","opts":["她不喜欢说话","她还不会说中文","她喜欢慢慢说","她常常听不懂别人说话"],"a":3},{"type":"理解","q":"TEXT C：哪个房间有自己的洗手间？","opts":["两个都没有","两个都有","在大学旁边的房间","在海边的房间"],"a":3},{"type":"理解","q":"TEXT C：大学旁边的房间每个星期多少钱？","opts":["两百块","两百五十块","一百块","一百八十块"],"a":3}]},"exam":{"reading":"exam/reading/paper.html","listening":"exam/listening/paper.html"}};

GL.forEach(g => { if (!DICT[g.zh]) DICT[g.zh] = {k: 'gl', zh: g.zh, en: g.en, py: g.py}; });
const MAXW = Math.max(...Object.keys(DICT).map(w => w.length));

function marks(t) {
  const m = new Array(t.length).fill(null);

    let hit = null;

function zhHTML(b) {

  const el = document.querySelector(`.blk[data-i="${i}"]`); if (el) { el.classList.add('now'); if (thenNext) el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  audio = new Audio(src); audio.playbackRate = S.speed; playing = i;
  audio.onended = () => { if (queue !== null && i + 1 < ch.blocks.length) { setTimeout(() => { if (queue !== null) playBlock(i + 1, true); }, 450); } else stop(); };
  audio.play().catch(() => stop());
  updateBar();
}
function updateBar() {
  const b = document.getElementById('bPlay'); if (!b) return;
  b.textContent = queue !== null ? '⏹ Stop' : '▶ Play chapter';
  document.getElementById('nowT').textContent = playing !== null && view.ch ? `Playing ${playing + 1} / ${view.ch.blocks.length}` : '';
}
document.getElementById('bPlay').onclick = () => { if (queue !== null) stop(); else { queue = 0; playBlock(0, true); } };
document.getElementById('bSpeed').onclick = () => { const o = [0.8, 1, 1.2]; S.speed = o[(o.indexOf(S.speed) + 1) % o.length]; save(); document.getElementById('bSpeed').textContent = S.speed + '×'; if (audio) audio.playbackRate = S.speed; };
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-open],[data-go],[data-home],[data-tog],[data-guide],[data-done],[data-tile],[data-untile],[data-chk],[data-reset],[data-pick],[data-tab],[data-test],[data-listen],.blk'); if (!t) return;
  if (t.dataset.open) renderChapter(+t.dataset.open), window.scrollTo(0, 0);
  else if (t.dataset.go) { renderChapter(+t.dataset.go); window.scrollTo(0, 0); }
  else if ('home' in t.dataset) renderHome();
  else if (t.dataset.tog) { S[t.dataset.tog] = !S[t.dataset.tog]; save(); rerender(); }
  else if (t.dataset.guide) { S.show[t.dataset.guide] = !S.show[t.dataset.guide]; save(); rerender(); }
  else if (t.dataset.tile) { const [k, i] = t.dataset.tile.split('|'); (S.ex[k] = S.ex[k] || []).push(+i); delete S.chk[k]; save(); rerender(); }
  else if (t.dataset.untile) { const [k, p] = t.dataset.untile.split('|'); S.ex[k].splice(+p, 1); delete S.chk[k]; save(); rerender(); }
  else if (t.dataset.chk) { S.chk[t.dataset.chk] = true; save(); rerender(); }
  else if (t.dataset.reset) { const k = t.dataset.reset; delete S.chk[k]; delete S.show[k];
    Object.keys(S.ex).forEach(x => { if (x === k || (/_[mfdq]$/.test(k) && x.startsWith(k) && /^\d+$/.test(x.slice(k.length)))) delete S.ex[x]; }); save(); rerender(); }
  else if (t.dataset.pick) { const [k, j] = t.dataset.pick.split('|'); S.ex[k] = +j; save(); rerender(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; save(); renderChapter(view.ch.id); window.scrollTo(0, 0); }
  else if ('test' in t.dataset) { renderTest(); SEL.value = 'test'; window.scrollTo(0, 0); }
  else if ('listen' in t.dataset) { if (queue !== null) stop(); else { queue = 0; playBlock(0, false); } }
  else if (t.dataset.done) { S.done[t.dataset.done] = !S.done[t.dataset.done]; save(); rerender(); }
  else if (t.classList.contains('blk')) { queue = null; playBlock(+t.dataset.i, false); }
});
document.addEventListener('keydown', ev => { const t = ev.target; if ((ev.key === 'Enter' || ev.key === ' ') && t.classList && t.classList.contains('blk')) { ev.preventDefault(); queue = null; playBlock(+t.dataset.i, false); } });
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.ans) { S.ans[t.dataset.ans] = t.value; save(); } if (t.tagName === 'TEXTAREA' && t.dataset.ex) { S.ex[t.dataset.ex] = t.value; save(); const c = document.querySelector(`[data-cnt="${t.dataset.ex}"]`); if (c) c.textContent = c.textContent.replace(/^\d+/, zhCount(t.value)); } });
document.addEventListener('change', ev => { const t = ev.target; if (t.dataset && t.dataset.ex) { S.ex[t.dataset.ex] = t.value; save(); if (t.tagName === 'SELECT' && S.chk[t.dataset.ex.replace(/\d+$/, '')]) rerender(); } });
document.getElementById('wtHeaderTitle').innerHTML = `<ruby>${esc(ST.title_zh)}<rt style="font-size:.42em;letter-spacing:.1em">${esc(ST.title_py)}</rt></ruby>`;
document.getElementById('wtHeaderZh').textContent = ST.title_en;
document.getElementById('wtHeaderSub').textContent = 'NCEA Chinese · Level ' + ST.level + ' Graded Reader · 分级读物';
const SEL = document.getElementById('chapterSelect');
SEL.innerHTML = '<option value="">Contents · 目录</option>' + ST.chapters.map(c => `<option value="${c.id}">${c.id}. ${esc(c.title_zh)} · ${esc(c.title_en)}</option>`).join('') + (ST.unit_test ? '<option value="test">✎ Unit test · 单元测试</option>' : '');
SEL.onchange = () => { if (SEL.value === 'test') renderTest(); else if (SEL.value) renderChapter(+SEL.value); else renderHome(); window.scrollTo(0, 0); };
const _rc = renderChapter, _rh = renderHome;
renderChapter = function (id) { _rc(id); SEL.value = String(id); };
renderHome = function () { _rh(); SEL.value = ''; };
renderHome();
</script>
