<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶奶的情书 · Grandma's Love Letters</title>
<style>
/* Layout: a single reading column on letter paper; chapters as a contents list, letters as framed sheets. */
:root{
  --bg:#f2ede3; --paper:#fbf8f1; --sheet:#fffdf8; --ink:#2b2930; --muted:#716a6f; --line:#e1d8c8;
  --rose:#a8455a; --rose-soft:#f3e0e3; --sea:#3d6b7b; --sea-soft:#e2edf0; --gold:#9a7a3c; --feel:#fbe7c8; --feel-ink:#7a4e12;
  --navy:#1b3a4b;
  --zh:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --en:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161b;--paper:#1f1e24;--sheet:#25232a;--ink:#ece7e1;--muted:#a59fa6;--line:#38343d;--rose:#e08a9b;--rose-soft:#3b2830;--sea:#8cc0d0;--sea-soft:#22333a;--gold:#d5b46e;--feel:#4a3a1e;--feel-ink:#f3d6a2;--navy:#e8e8ed;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161b;--paper:#1f1e24;--sheet:#25232a;--ink:#ece7e1;--muted:#a59fa6;--line:#38343d;--rose:#e08a9b;--rose-soft:#3b2830;--sea:#8cc0d0;--sea-soft:#22333a;--gold:#d5b46e;--feel:#4a3a1e;--feel-ink:#f3d6a2;--navy:#e8e8ed;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--ui)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.zh{font-family:var(--zh)}
/* cover */
.cover{text-align:center;padding:34px 12px 22px}
.cover .py{color:var(--muted);letter-spacing:.12em;font-size:.85rem}
.cover h1{font-family:var(--zh);font-size:clamp(2.4rem,9vw,3.4rem);margin:4px 0 2px;color:var(--rose);font-weight:700;letter-spacing:.12em}
.cover .en{font-family:var(--en);font-style:italic;font-size:1.15rem;color:var(--ink)}
.cover .lvl{display:inline-block;margin-top:12px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sea);border:1px solid var(--sea);border-radius:999px;padding:3px 12px}
.blurb{font-family:var(--en);font-size:1rem;line-height:1.65;color:var(--muted);max-width:560px;margin:16px auto 0;text-align:center}
.how{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.86rem;color:var(--muted);margin:18px 0}
.how b{color:var(--ink)}
.toc{display:grid;gap:8px}
.toc button{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toc button:hover{border-color:var(--rose)}
.toc .n{font-family:var(--en);font-size:1.4rem;color:var(--rose);text-align:center}
.toc .t{font-family:var(--zh);font-size:1.1rem}.toc .s{font-size:.8rem;color:var(--muted)}
.toc .k{font-size:.72rem;color:var(--sea);white-space:nowrap}.toc .done{color:var(--gold);font-size:.8rem}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
/* chapter */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem}
.pill:disabled{opacity:.4;cursor:default}
.pill.on{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
.pill.play{background:var(--rose);border-color:var(--rose);color:var(--sheet);font-weight:600}
.chead{text-align:center;margin:14px 0 6px}
.chead .num{font-family:var(--en);font-style:italic;color:var(--rose)}
.chead h2{font-family:var(--zh);font-size:1.9rem;margin:2px 0;letter-spacing:.06em}
.chead .py{color:var(--muted);font-size:.85rem}.chead .en{font-family:var(--en);font-style:italic}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 16px}
.story{font-family:var(--zh);font-size:1.22rem;line-height:2.05}
.blk{border-radius:10px;padding:4px 8px;margin:2px -8px 8px;cursor:pointer;transition:background .15s}
.blk:hover{background:var(--rose-soft)}
.blk.now{background:var(--sea-soft)}
.blk .who{font-family:var(--ui);font-size:.72rem;color:var(--sea);letter-spacing:.06em;margin-right:6px;font-weight:700}
.blk .en{display:block;font-family:var(--en);font-size:.95rem;line-height:1.55;color:var(--muted);margin-top:2px}
.letter{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:22px 24px 18px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2.02em,var(--line) 2.02em,var(--line) calc(2.02em + 1px));background-color:var(--sheet)}
.letter .date{font-family:var(--ui);font-size:.78rem;color:var(--muted);text-align:right;margin-bottom:6px}
.letter .sign{text-align:right}
.letter .poem{text-align:center;font-style:italic;color:var(--rose);white-space:pre-line}
ruby{ruby-position:over}rt{font-family:var(--ui);font-size:.5em;color:var(--sea);letter-spacing:0}
.story.pyon{line-height:2.9}
.story.pyon .letter{background-image:none}
.gl{border-bottom:2px dotted var(--rose)}
.fe{background:var(--feel);color:var(--feel-ink);border-radius:3px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:18px}
.box h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
.chips span b{font-family:var(--zh);font-size:1.05rem}
.chips i{font-style:normal;color:var(--muted)}
.q{margin-top:14px}
.q p{margin:0 0 6px;font-weight:600}
.q .band{font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;border:1px solid var(--line);color:var(--muted)}
.q .band.E{color:var(--gold);border-color:var(--gold)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical}
.guide{margin-top:8px;font-size:.9rem;border-left:3px solid var(--gold);padding:6px 12px;background:var(--sheet);border-radius:0 10px 10px 0}
.guide ul{margin:4px 0 8px;padding-left:18px}.guide .m{font-family:var(--en);line-height:1.55}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .now-t{font-size:.8rem;color:var(--muted);min-width:0}
.bar[hidden]{display:none}
/* Words That Think band, logo header and footer (as in the other apps) */
.top-bar{background:#0b1c26;color:#fff;padding:.6rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b1c26;z-index:11}
.top-bar .title{font-weight:700;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar select{padding:.4rem .6rem;border-radius:4px;border:none;font-size:.85rem;background:#fff;color:#0b1c26;cursor:pointer;max-width:200px}
.wt-header{display:flex;align-items:center;gap:1.1rem;margin:.4rem 0 1rem}

，是他写给我的情书。”","en":"\"That's me and your grandfather. Inside the box are the love letters he wrote to me.\"","py":["","zhè","shì","wǒ","hé","nǐ","yé","ye","","hé","zi","lǐ","miàn","","shì","tā","xiě","gěi","wǒ","de","qíng","shū","",""]},{"t":"p","zh":"我打开盒子，里面有很多很多信。每一封都很旧，可是都很干净。我很想知道：奶奶和爷爷是怎么认识的？","en":"I opened the box. Inside there were lots and lots of letters. Every one was old, but they were all very clean. I really wanted to know: how did Grandma and Grandpa meet?","py":["wǒ","dǎ","kāi","hé","zi","","lǐ","miàn","yǒu","hěn","duō","hěn","duō","xìn","","měi","yì","fēng","dōu","hěn","jiù","","kě","shì","dōu","hěn","gān","jìng","","wǒ","hěn","xiǎng","zhī","dao","","nǎi","nai","hé","yé","ye","shì","zěn","me","rèn","shi","de",""]},{"t":"p","zh":"回家的路上，爸爸又说：","en":"On the way home, Dad said it again:","py":["huí","jiā","de","lù","shàng","","bà","ba","yòu","shuō",""]},{"t":"say","who":"爸爸","zh":"“安娜，下个学期你要多学习数学，不要每个周末都去摄影了。”","en":"\"Ana, next term you need to study more maths. Don't go taking photos every weekend.\"","py":["","ān","nà","","xià","gè","xué","qī","nǐ","yào","duō","xué","xí","shù","xué","","bú","yào","měi","gè","zhōu","mò","dōu","qù","shè","yǐng","le","",""]},{"t":"p","zh":"我没有说话。我一直看车的窗户外面，很不开心。","en":"I didn't say anything. I kept looking out of the car window, very unhappy.","py":["wǒ","méi","yǒu","shuō","huà","","wǒ","yì","zhí","kàn","chē","de","chuāng","hu","wài","miàn","","hěn","bù","kāi","xīn",""]}],"questions":[{"band":"A","q":"What does Ana find in Grandma's room, and what is inside it?","points":["An old red box with an old photo on top: a young girl and a tall boy by a lake.","Inside are lots of old but clean letters — Grandpa's love letters to Grandma."],"model":"Ana finds an old red box with an old photo on top of a young girl and a tall boy standing by a lake. Inside are many old but very clean letters — the love letters Grandpa wrote to Grandma."},{"band":"E","q":"How does Grandma feel when Ana asks about the photo, and how does Ana feel at the end of the chapter? Use evidence.","points":["Grandma's face turns red and she speaks slowly — she is shy/embarrassed but moved; the letters still matter to her (they are kept very clean).","Ana is unhappy: Dad repeats (又说) that she should study maths and stop taking photos every weekend; she says nothing and stares out of the window.","The chapter sets up two stories: Grandma's past love and Ana's present conflict with Dad."],"model":"Grandma is shy and moved: her face quickly turns red and she speaks slowly when she explains that the box holds Grandpa's love letters. The letters are old but very clean, which suggests she has treasured them for decades. Ana, by contrast, ends the chapter unhappy. Dad says 'again' (又说) that she must study maths and stop taking photos every weekend — so this is an ongoing argument — and Ana doesn't answer but stares out of the car window, showing she feels frustrated and unheard."}],"title_py":"hóng sè de hé zi"},{"id":2,"kind":"letter","title_zh":"湖边的大树","title_en":"The big tree by the lake","date":"1975年10月3日，台北","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"对不起，我给你写这封信。","en":"I'm sorry to write you this letter.","py":["duì","bù","qǐ","","wǒ","gěi","nǐ","xiě","zhè","fēng","xìn",""]},{"t":"letter","who":"爷爷","zh":"我是每天给你家送信的邮差。每天下午四点，我都看到你坐在湖边的大树下面看书。你看书的时候很安静，很好看。","en":"I'm the postman who delivers letters to your house every day. Every afternoon at four, I see you sitting under the big tree by the lake, reading. When you read, you are so calm, so lovely.","py":["wǒ","shì","měi","tiān","gěi","nǐ","jiā","sòng","xìn","de","yóu","chāi","","měi","tiān","xià","wǔ","sì","diǎn","","wǒ","dōu","kàn","dào","nǐ","zuò","zài","hú","biān","de","dà","shù","xià","miàn","kàn","shū","","nǐ","kàn","shū","de","shí","hou","hěn","ān","jìng","","hěn","hǎo","kàn",""]},{"t":"letter","who":"爷爷","zh":"我知道，我只是一个邮差，我家也没有钱。可是我每天最期待的，就是下午四点走到你家门口。","en":"I know I'm only a postman, and my family has no money. But what I look forward to most every day is walking to your door at four in the afternoon.","py":["wǒ","zhī","dao","","wǒ","zhǐ","shì","yí","gè","yóu","chāi","","wǒ","jiā","yě","méi","yǒu","qián","","kě","shì","wǒ","měi","tiān","zuì","qī","dài","de","","jiù","shì","xià","wǔ","sì","diǎn","zǒu","dào","nǐ","jiā","mén","kǒu",""]},{"t":"letter","who":"爷爷","zh":"这个星期天下午，我会在湖边的大树下面等你。如果你不来，我不会生气，我还是会每天给你家送信。","en":"This Sunday afternoon I will wait for you under the big tree by the lake. If you don't come, I won't be angry — I'll still deliver letters to your house every day.","py":["zhè","ge","xīng","qī","tiān","xià","wǔ","","wǒ","huì","zài","hú","biān","de","dà","shù","xià","miàn","děng","nǐ","","rú","guǒ","nǐ","bù","lái","","wǒ","bú","huì","shēng","qì","","wǒ","hái","shì","huì","měi","tiān","gěi","nǐ","jiā","sòng","xìn",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"Who is the writer, and what does he ask Yue to do?","points":["Hai, the postman who delivers letters to her house every day.","He sees her reading under the big tree by the lake at 4 pm every day.","He asks her to meet him under the tree by the lake on Sunday afternoon."],"model":"The writer is Hai, the postman who delivers letters to Yue's house every day. He has seen her reading under the big tree by the lake every afternoon at four, and he asks her to meet him there on Sunday afternoon."},{"band":"E","q":"What kind of person is Hai? Use evidence from the letter to support your answer.","points":["Shy and polite: he begins by apologising for writing.","Honest and humble: admits he is only a postman with no money.","Sincere: the 4 pm walk to her door is what he looks forward to most.","Respectful, not pushy: if she doesn't come he won't be angry and will still deliver letters."],"model":"Hai is shy, honest and respectful. He begins by apologising for writing at all, which shows he is polite and a little nervous. He is honest about his situation — he 生气。他说：‘他只是一个邮差，他不能给你好的生活！’从那天开始，我爸爸不让我再去湖边。”","en":"\"When they found out, my father was furious. He said, 'He's only a postman — he can't give you a good life!' From that day on, my father wouldn't let me go to the lake again.\"","py":["","zhī","dao","le","yǐ","hòu","","wǒ","bà","ba","fēi","cháng","shēng","qì","","tā","shuō","","","tā","zhǐ","shì","yí","gè","yóu","chāi","","tā","bù","néng","gěi","nǐ","hǎo","de","shēng","huó","","","cóng","nà","tiān","kāi","shǐ","","wǒ","bà","ba","bú","ràng","wǒ","zài","qù","hú","biān","",""]},{"t":"p","zh":"我又想到爸爸在车上说的话。原来，奶奶也有一个不同意她的爸爸。","en":"I thought again of what Dad had said in the car. So Grandma had a father who didn't approve of her, too.","py":["wǒ","yòu","xiǎng","dào","bà","ba","zài","chē","shàng","shuō","de","huà","","yuán","lái","","nǎi","nai","yě","yǒu","yí","gè","bù","tóng","yì","tā","de","bà","ba",""]}],"questions":[{"band":"A","q":"What happened at the lake, and what happened when Grandma's parents found out?","points":["Grandma went, wearing a white dress, but was too shy to speak.","They sat by the lake a long time, looking at the water and listening to birds; then met every Sunday.","Her father was furious: 'He's only a postman — he can't give you a good life'; he stopped her going to the lake."],"model":"Grandma went to the lake in a white dress but was too shy to say anything. They sat together for a long time, looking at the water and listening to the birds, and after that they met there every Sunday. When her parents found out, her father was furious, said a postman couldn't give her a good life, and banned her from going to the lake."},{"band":"E","q":"What connection does Ana make between Grandma's story and her own life? Explain.","points":["She remembers Dad's words in the car (about studying maths, not photography).","原来 shows a discovery: Grandma also had a father who opposed what she wanted.","Implied: Ana begins to see her conflict as part of a family pattern — parents opposing children's choices — and to feel less alone."],"model":"Ana thinks again of Dad's words in the car, when he told her to stop taking photos and study maths. The word 原来 ('so it turns out') shows a discovery: Grandma also had a father who disapproved of what she wanted. Ana realises her conflict with Dad isn't unique — it echoes something that happened in her own family two generations earlier — which makes her feel less alone and prepares her to see Dad's position differently later."}],"title_py":"nǎi nai de gù shì"},{"id":4,"kind":"letter","title_zh":"雨中的码头","title_en":"The harbour in the rain","date":"1976年3月12日，台湾","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"对不起，昨天在码头，我没有告诉你我想说的话。","en":"I'm sorry — yesterday at the harbour, I didn't tell you what I wanted to say.","py":["duì","bù","qǐ","","zuó","tiān","zài","mǎ","tóu","","wǒ","méi","yǒu","gào","su","nǐ","wǒ","xiǎng","shuō","de","huà",""]},{"t":"letter","who":"爷爷","zh":"你爸爸说得对，现在的我，不能给你好的生活。所以我决定去新西兰工作两年。那里的农场要很多工人，在那里工作，挣钱比这里多。两年以后，我会带钱回来，请你爸爸同意我们在一起。","en":"Your father is right: as I am now, I can't give you a good life. So I've decided to go to New Zealand to work for two years. The farms there need lots of workers, and you can earn more money there than here. In two years I will come back with money and ask your father to agree to us being together.","py":["nǐ","bà","ba","shuō","de","duì","","xiàn","zài","de","wǒ","","bù","néng","gěi","nǐ","hǎo","de","shēng","huó","","suǒ","yǐ","wǒ","jué","dìng","qù","xīn","xī","lán","gōng","zuò","liǎng","nián","","nà","lǐ","de","nóng","chǎng","yào","hěn","duō","gōng","rén","","zài","nà","lǐ","gōng","zuò","","zhèng","qián","bǐ","zhè","lǐ","duō","","liǎng","nián","yǐ","hòu","","wǒ","huì","dài","qián","huí","lái","","qǐng","nǐ","bà","ba","tóng","yì","wǒ","men","zài","yì","qǐ",""]},{"t":"letter","who":"爷爷","zh":"昨天下雨，你在码头哭了，我也很难过。可是请你相信我：我每个月都会给你写一封信。你看到月亮的时候，就像看到我。","en":"Yesterday it rained, and you cried at the harbour. I was very sad too. But please believe me: I will write you a letter every month. When you look at the moon, it will be like seeing me.","py":["zuó","tiān","xià","yǔ","","nǐ","zài","mǎ","tóu","kū","le","","wǒ","yě","hěn","nán","guò","","kě","shì","qǐng","nǐ","xiāng","xìn","wǒ","","wǒ","měi","gè","yuè","dū","huì","gěi","nǐ","xiě","yì","fēng","xìn","","nǐ","kàn","dào","yuè","liang","de","shí","hou","","jiù","xiàng","kàn","dào","wǒ",""]},{"t":"letter","who":"爷爷","zh":"等我回来。","en":"Wait for me to come back.","py":["děng","wǒ","huí","lái",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"What has Hai decided to do, and why?","points":["Go to New Zealand to work for two years.","Farms there need lots of workers; he can earn more money than at home.","He will come back with money and ask her father to agree to them being together."],"model":"Hai has decided to work in New Zealand for two years because farms there need many workers and he can earn more than at home. He plans to come back with money and ask Yue's father to accept their relationship."},{"band":"E","q":"How does Hai try to comfort Yue in this letter, and what does this show about his feelings?","points":["He admits her father is right — he takes responsibility instead of blaming him.","Promises a letter every month; 'please believe me'.","The moon image: when she sees the moon it is like seeing him — they share it despite distance.","Shows deep, committed love and determination ('wait for me to come back')."],"model":"Hai comforts Yue with promises and an image. He accepts that her father is right — he can't give her a good life yet — so instead of blaming anyone he takes responsibility and makes a plan. He begs her to believe him and promises a letter every month, and he gives her the moon: whenever she sees it, it will be like seeing him, so the distance won't separate them. His last line, 'wait for me to come back', shows how committed and determined he is, even though he is also sad (我也很难过)."}],"title_py":"yǔ zhōng de mǎ tóu"},{"id":5,"kind":"now","title_zh":"我和爸爸吵架了","title_en":"My argument with Dad","blocks":[{"t":"p","zh":"星期五晚上，我告诉爸爸，学校有一个摄影比赛，我想参加。照片最好的学生可以去惠灵顿学习摄影一个星期。","en":"On Friday evening I told Dad that school has a photography competition and I want to enter. The student with the best photo can go to Wellington to study photography for a week.","py":["xīng","qī","wǔ","wǎn","shang","","wǒ","gào","su","bà","ba","","xué","xiào","yǒu","yí","gè","shè","yǐng","bǐ","sài","","wǒ","xiǎng","cān","jiā","","zhào","piàn","zuì","hǎo","de","xué","sheng","kě","yǐ","qù","huì","líng","dùn","xué","xí","shè","yǐng","yí","gè","xīng","qī",""]},{"t":"say","who":"爸爸","zh":"“摄影比赛？下个月就要考试了，你应该多复习数学！摄影以后能当工作吗？”","en":"\"A photography competition? You've got exams next month — you should be revising maths! Can taking photos ever be a job?\"","py":["","shè","yǐng","bǐ","sài","","xià","gè","yuè","jiù","yào","kǎo","shì","le","","nǐ","yīng","gāi","duō","fù","xí","shù","xué","","shè","yǐng","yǐ","hòu","néng","dāng","gōng","zuò","ma","",""]},{"t":"say","who":"安娜","zh":"“可是我最喜欢摄影！你一点儿都不明白我！”","en":"\"But photography is what I love most! You don't understand me at all!\"","py":["","kě","shì","wǒ","zuì","xǐ","huan","shè","yǐng","","nǐ","yì","diǎnr","ér","dōu","bù","míng","bai","wǒ","",""]},{"t":"p","zh":"我跑回自己的房间，哭了很久。","en":"I ran back to my room and cried for a long time.","py":["wǒ","pǎo","huí","zì","jǐ","de","fáng","jiān","","kū","le","hěn","jiǔ",""]},{"t":"p","zh":"过了一会儿，奶奶来了。她坐在我旁边，给了我一封爷爷的信。","en":"After a while, Grandma came in. She sat down beside me and gave me one of Grandpa's letters.","py":["guò","le","yí","huìr","er","","nǎi","nai","lái","le","","tā","zuò","zài","wǒ","páng","biān","","gěi","le","wǒ","yì","fēng","yé","ye","de","xìn",""]},{"t":"say","who":"奶奶","zh":"“安娜，你爸爸很爱你，就像我爸爸很爱我。他们只是不知道，应该怎么爱我们。”","en":"\"Ana, your dad loves you very much, just like my father loved me. They just don't know how they should love us.\"","py":["","ān","nà","","nǐ","bà","ba","hěn","ài","nǐ","","jiù","xiàng","wǒ","bà","ba","hěn","ài","wǒ","","tā","men","zhǐ","shì","bù","zhī","dao","","yīng","gāi","zěn","me","ài","wǒ","men","",""]},{"t":"p","zh":"我看奶奶，不知道应该说什么。","en":"I looked at Grandma and didn't know what to say.","py":["wǒ","kàn","nǎi","nai","","bù","zhī","dao","yīng","gāi","shuō","shén","me",""]}],"questions":[{"band":"A","q":"Why do Ana and her dad argue?","points":["Ana wants to enter a school photography competition; the best photo wins a week of photography study in Wellington.","Dad says exams are next month, she should revise maths, and doubts photography can be a job.","Ana says photography is what she loves most and that he doesn't understand her."],"model":"Ana wants to enter the school photography competition — the best photo wins a week studying photography in Wellington. Dad objects because exams are next month and he thinks she should revise maths; he doubts photography could ever be a job. Ana replies that it is what she loves most and that he doesn't understand her."},{"band":"E","q":"What does Grandma mean by 'they just don't know how they should love us'? Explain how it links to her own story.","points":["Parents' opposition comes from love, not from not caring.","Dad's worry about exams/jobs = care for Ana's future, like Grandma's father worrying a postman couldn't give her a good life.","Grandma sees both conflicts as the same: love expressed as control. She gives Ana a letter so she can see it for herself."],"model":"Grandma means that parents who stand in their children's way usually do so out of love, but express it badly — through control and worry rather than understanding. Ana's dad pushes maths because he cares about her exams and future job, just as Grandma's father opposed a poor postman because he wanted her to have a good life. By saying 'just like my father loved me' and handing Ana one of Grandpa's letters, Grandma is linking the two stories and asking Ana to see her father's anger as care."}],"title_py":"wǒ hé bà ba chǎo jià le"},{"id":6,"kind":"letter","title_zh":"南半球的月亮","title_en":"The moon of the Southern Hemisphere","date":"1977年1月20日，新西兰南岛","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"这是我在新西兰写的第十封信了。","en":"This is the tenth letter I have written in New Zealand.","py":["zhè","shì","wǒ","zài","xīn","xī","lán","xiě","de","dì","shí","fēng","xìn","le",""]},{"t":"letter","who":"爷爷","zh":"现在这里是夏天，天气很好，草地非常绿，农场里有一千多只羊。我每天早上五点起床，工作到晚上七点。很累，可是我不怕。","en":"It's summer here now. The weather is lovely, the grass is so green, and the farm has more than a thousand sheep. Every day I get up at five and work until seven in the evening. It's tiring, but I'm not afraid.","py":["xiàn","zài","zhè","lǐ","shì","xià","tiān","","tiān","qì","hěn","hǎo","","cǎo","dì","fēi","cháng","lǜ","","nóng","chǎng","lǐ","yǒu","yì","qiān","duō","zhǐ","yáng","","wǒ","měi","tiān","zǎo","shàng","wǔ","diǎn","qǐ","chuáng","","gōng","zuò","dào","wǎn","shang","qī","diǎn","","hěn","lèi","","kě","shì","wǒ","bú","pà",""]},{"t":"letter","who":"爷爷","zh":"晚上，我常常一个人坐在草地上看星星。这里的星星和台湾的不一样，可是月亮是一样的。我给你写了一首小诗：","en":"At night I often sit alone on the grass looking at the stars. The stars here are different from Taiwan's, but the moon is the same. I wrote you a little poem:","py":["wǎn","shang","","wǒ","cháng","cháng","yí","gè","rén","zuò","zài","cǎo","dì","shàng","kàn","xīng","xīng","","zhè","lǐ","de","xīng","xīng","hé","tái","wān","de","bù","yí","yàng","","kě","shì","yuè","liang","shì","yí","yàng","de","","wǒ","gěi","nǐ","xiě","le","yì","shǒu","xiǎo","shī",""]},{"t":"poem","who":"爷爷","zh":"你在北半球看月亮，\n我在南半球想你。\n月亮只有一个，\n就像我的心，只给你。","en":"You look at the moon in the north,\nI miss you in the south.\nThere is only one moon —\nlike my heart, only for you.","py":["nǐ","zài","běi","bàn","qiú","kàn","yuè","liang","","","wǒ","zài","nán","bàn","qiú","xiǎng","nǐ","","","yuè","liang","zhǐ","yǒu","yí","gè","","","jiù","xiàng","wǒ","de","xīn","","zhǐ","gěi","nǐ",""]},{"t":"letter","who":"爷爷","zh":"你最近好吗？你爸爸还在生气吗？为什么你已经三个月没有给我写信了？","en":"How are you? Is your father still angry? Why haven't you written to me for three months?","py":["nǐ","zuì","jìn","hǎo","ma","","nǐ","bà","ba","hái","zài","shēng","qì","ma","","wèi","shén","me","nǐ","yǐ","jīng","sān","gè","yuè","méi","yǒu","gěi","wǒ","xiě","xìn","le",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"Describe Hai's life in New Zealand.","points":["Summer: good weather, very green grass, more than 1,000 sheep on the farm.","Gets up at 5 and works until 7 pm; tiring but he isn't afraid.","At night sits alone on the grass looking at the stars."],"model":"Hai works on a South Island farm with more than a thousand sheep. It is summer, the weather is good and the grass very green. He gets up at five and works until seven at night; it is exhausting, but he says he is not afraid. At night he sits alone on the grass looking at the stars."},{"band":"E","q":"What does the poem mean, and why might Hai be worried at the end of the letter?","points":["North/south hemispheres show the distance; the one moon they both see is like his heart — only for her: loyalty despite distance.","Worry: she hasn't written for three months; he asks if her father is still angry — he suspects something is wrong.","Irony (for the reader): we will learn the letters were hidden."],"model":"In the poem, Yue looks at the moon in the northern hemisphere while Hai misses her from the southern hemisphere: the hemispheres show how far apart they are. But there is only one moon, which they both see — just like his heart, which belongs only to her. It is a promise of loyalty despite the distance. At the end, though, Hai is worried: Yue hasn't written for three months. He asks whether her father is still angry, which shows he suspects her father is behind the silence — and the reader later discovers he is right."}],"title_py":"nán bàn qiú de yuè liang"},{"id":7,"kind":"now","title_zh":"没有打开的信","title_en":"The unopened letters","blocks":[{"t":"p","zh":"在盒子的最下面，我找到了十几封没有打开的信。每一封都是爷爷从新西兰发来的。","en":"At the very bottom of the box I found more than ten unopened letters. Every one had been sent by Grandpa from New Zealand.","py":["zài","hé","zi","de","zuì","xià","miàn","","wǒ","zhǎo","dào","le","shí","jǐ","fēng","méi","yǒu","dǎ","kāi","de","xìn","","měi","yì","fēng","dōu","shì","yé","ye","cóng","xīn","xī","lán","fā","lái","de",""]},{"t":"say","who":"安娜","zh":"“奶奶，这些信为什么没有打开？”","en":"\"Grandma, why haven't these letters been opened?\"","py":["","nǎi","nai","","zhè","xiē","xìn","wèi","shén","me","méi","yǒu","dǎ","kāi","",""]},{"t":"p","zh":"奶奶看了这些信很久，眼睛红了。","en":"Grandma looked at the letters for a long time, and her eyes turned red.","py":["nǎi","nai","kàn","le","zhè","xiē","xìn","hěn","jiǔ","","yǎn","jīng","hóng","le",""]},{"t":"say","who":"奶奶","zh":"“那一年，我一封信也没有收到。我觉得他一定忘了我，在新西兰认识了别的女生。我每天晚上都哭。后来，我爸爸让我认识了一个医生。他很有钱，可是我一点儿都不喜欢他。”","en":"\"That year, I didn't receive a single letter. I thought he must have forgotten me and met another girl in New Zealand. I cried every night. Later, my father introduced me to a doctor. He was rich, but I didn't like him at all.\"","py":["","nà","yì","nián","","wǒ","yì","fēng","xìn","yě","méi","yǒu","shōu","dào","","wǒ","jué","de","tā","yí","dìng","wàng","le","wǒ","","zài","xīn","xī","lán","rèn","shi","le","bié","de","nǚ","shēng","","wǒ","měi","tiān","wǎn","shang","dōu","kū","","hòu","lái","","wǒ","bà","ba","ràng","wǒ","rèn","shi","le","yí","gè","yī","shēng","","tā","hěn","yǒu","qián","","kě","shì","wǒ","yì","diǎnr","ér","dōu","bù","xǐ","huan","tā","",""]},{"t":"say","who":"安娜","zh":"“那这些信……”","en":"\"So these letters…\"","py":["","nà","zhè","xiē","xìn","","",""]},{"t":"say","who":"奶奶","zh":"“很多年以后，我才知道，是我爸爸把这些信都藏起来了。”","en":"\"Many years later, I found out that my father had hidden all these letters.\"","py":["","hěn","duō","nián","yǐ","hòu","","wǒ","cái","zhī","dao","","shì","wǒ","bà","ba","bǎ","zhè","xiē","xìn","dōu","cáng","qǐ","lai","le","",""]},{"t":"p","zh":"我看这些信，很难过。爷爷每个月都在写信，可是奶奶一直不知道。","en":"I looked at the letters and felt very sad. Grandpa had written every month, but Grandma never knew.","py":["wǒ","kàn","zhè","xiē","xìn","","hěn","nán","guò","","yé","ye","měi","gè","yuè","dōu","zài","xiě","xìn","","kě","shì","nǎi","nai","yì","zhí","bù","zhī","dao",""]}],"questions":[{"band":"A","q":"What does Ana find, and what really happened to the letters?","points":["More than ten unopened letters from Grandpa in New Zealand, at the bottom of the box.","Grandma received none that year; many years later she learned her father had hidden them."],"model":"At the bottom of the box Ana finds more than ten unopened letters Grandpa sent from New Zealand. That year Grandma received none of them; many years later she learned that her father had hidden them all."},{"band":"E","q":"How did the missing letters affect Grandma at the time? Why is this chapter so sad?","points":["She believed Hai had forgotten her and met another girl; cried every night.","Her father introduced her to a rich doctor she didn't like — he used the silence to push another match.","Sad because both were faithful: Grandpa wrote every month, Grandma kept loving him, but neither knew; her eyes still turn red decades later."],"model":"Because no letters came, Grandma believed Hai had forgotten her and found another girl in New Zealand, and she cried every night. Her father took advantage of this: he introduced her to a rich doctor, whom she didn't like at all. The chapter is so sad because both of them stayed faithful — Grandpa wrote every single month and Grandma kept loving him — yet each thought the other had given up. Even decades later, Grandma's eyes turn red when she looks at the unopened letters, showing how deep that pain was."}],"title_py":"méi yǒu dǎ kāi de xìn"},{"id":8,"kind":"letter","title_zh":"我会在湖边等你","title_en":"I will wait for you by the lake","date":"1978年5月1日，新西兰","blocks":[{"t":"head","who":"爷爷","zh":"月：","en":"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"你已经一年没有给我写信了。我不知道为什么，可是我不相信你忘了我。这封信，我请你的好朋友小兰交给你。","en":"You haven't written to me for a year. I don't know why, but I don't believe you have forgotten me. I'm asking your good friend Xiaolan to give you this letter.","py":["nǐ","yǐ","jīng","yì","nián","méi","yǒu","gěi","wǒ","xiě","xìn","le","","wǒ","bù","zhī","dao","wèi","shén","me","","kě","shì","wǒ","bù","xiāng","xìn","nǐ","wàng","le","wǒ","","zhè","fēng","xìn","","wǒ","qǐng","nǐ","de","hǎo","péng","you","xiǎo","lán","jiāo","gěi","nǐ",""]},{"t":"letter","who":"爷爷","zh":"我两年的工作做完了，我也有了一些钱。五月十二日，我会回到台北。那天下午四点，我会在湖边的大树下面等你，就像我们第一次见面的时候。","en":"My two years of work are finished, and I have some money now. On the twelfth of May I will be back in Taipei. That afternoon at four, I will wait for you under the big tree by the lake — just like the first time we met.","py":["wǒ","liǎng","nián","de","gōng","zuò","zuò","wán","le","","wǒ","yě","yǒu","le","yì","xiē","qián","","wǔ","yuè","shí","èr","rì","","wǒ","huì","huí","dào","tái","běi","","nà","tiān","xià","wǔ","sì","diǎn","","wǒ","huì","zài","hú","biān","de","dà","shù","xià","miàn","děng","nǐ","","jiù","xiàng","wǒ","men","dì","yī","cì","jiàn","miàn","de","shí","hou",""]},{"t":"letter","who":"爷爷","zh":"如果你不来，我会明白。我会离开，不会再给你写信了。","en":"If you don't come, I'll understand. I'll leave, and I won't write to you again.","py":["rú","guǒ","nǐ","bù","lái","","wǒ","huì","míng","bai","","wǒ","huì","lí","kāi","","bú","huì","zài","gěi","nǐ","xiě","xìn","le",""]},{"t":"letter","who":"爷爷","zh":"可是，如果你来，我会照顾你一辈子。","en":"But if you come, I will take care of you for the rest of my life.","py":["kě","shì","","rú","guǒ","nǐ","lái","","wǒ","huì","zhào","gù","nǐ","yí","bèi","zi",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"How does this letter reach Yue, and what is Hai's plan?","points":["He asks her good friend Xiaolan to give it to her.","His two years are finished and he has some money; back in Taipei on 12 May.","He'll wait under the big tree by the lake at 4 pm, like their first meeting."],"model":"Hai sends this letter through Yue's good friend Xiaolan. His two years of work are over and he has saved some money; on 12 May he will return to Taipei and wait for her at four o'clock under the big tree by the lake, just like their first meeting."},{"band":"E","q":"Why does Hai send this letter through Xiaolan, and how does the letter show his character has stayed the same?","points":["Implied: he suspects his letters aren't reaching her (a year of silence) so he avoids her family's address.","Same place and time (4 pm, the big tree) as his first letter — loyalty and romance.","Still respectful: if she doesn't come he'll understand, leave and not write again.","But more confident: promises to take care of her for life."],"model":"Hai sends the letter through Xiaolan because, after a year of silence, he suspects his letters are not reaching Yue — he refuses to believe she has forgotten him, so he goes around her family. The letter shows that he hasn't changed: he chooses the same place and time as his very first letter — four o'clock under the big tree — which is both loyal and romantic. He is still respectful, promising to understand, leave and never write again if she doesn't come. But he is also more confident now that he has kept his promise: if she comes, he will take care of her for the rest of his life."}],"title_py":"wǒ huì zài hú biān děng nǐ"},{"id":9,"kind":"now","title_zh":"那天的雨","title_en":"The rain that day","blocks":[{"t":"say","who":"安娜","zh":"“奶奶，五月十二日，你去湖边了吗？”","en":"\"Grandma, on the twelfth of May — did you go to the lake?\"","py":["","nǎi","nai","","wǔ","yuè","shí","èr","rì","","nǐ","qù","hú","biān","le","ma","",""]},{"t":"say","who":"奶奶","zh":"“那天下了很大的雨。我爸爸不让我出门，我一直在窗户旁边哭。到了晚上九点，雨还在下。我想，他一定已经走了。”","en":"\"It rained heavily that day. My father wouldn't let me go out, and I cried by the window the whole time. By nine at night it was still raining. I thought he must have gone.\"","py":["","nà","tiān","xià","le","hěn","dà","de","yǔ","","wǒ","bà","ba","bú","ràng","wǒ","chū","mén","","wǒ","yì","zhí","zài","chuāng","hu","páng","biān","kū","","dào","le","wǎn","shang","jiǔ","diǎn","","yǔ","hái","zài","xià","","wǒ","xiǎng","","tā","yí","dìng","yǐ","jīng","zǒu","le","",""]},{"t":"say","who":"奶奶","zh":"“可是，我爸爸自己带了雨伞去了湖边。他看到你爷爷一个人站在大树下面，衣服都湿了，可是他还在等。”","en":"\"But my father took an umbrella and went to the lake himself. He saw your grandfather standing alone under the big tree, his clothes soaking wet — and still waiting.\"","py":["","kě","shì","","wǒ","bà","ba","zì","jǐ","dài","le","yǔ","sǎn","qù","le","hú","biān","","tā","kàn","dào","nǐ","yé","ye","yí","gè","rén","zhàn","zài","dà","shù","xià","miàn","","yī","fu","dōu","shī","le","","kě","shì","tā","hái","zài","děng","",""]},{"t":"say","who":"奶奶","zh":"“我爸爸问他：‘你等了多久？’他说：‘从下午四点到现在。如果她今天不来，我明天还来。’”","en":"\"My father asked him, 'How long have you been waiting?' He said, 'Since four this afternoon. If she doesn't come today, I'll come back tomorrow.'\"","py":["","wǒ","bà","ba","wèn","tā","","","nǐ","děng","le","duō","jiǔ","","","tā","shuō","","","cóng","xià","wǔ","sì","diǎn","dào","xiàn","zài","","rú","guǒ","tā","jīn","tiān","bù","lái","","wǒ","míng","tiān","hái","lái","","",""]},{"t":"p","zh":"奶奶说，那天晚上，她爸爸带爷爷回了家。他对奶奶说：“这个年轻人，可以相信。”一年以后，奶奶和爷爷结婚了，后来一起来到了新西兰。","en":"Grandma said that night her father brought Grandpa home. He said to Grandma, \"This young man can be trusted.\" A year later, Grandma and Grandpa got married, and later they came to New Zealand together.","py":["nǎi","nai","shuō","","nà","tiān","wǎn","shang","","tā","bà","ba","dài","yé","ye","huí","le","jiā","","tā","duì","nǎi","nai","shuō","","","zhè","ge","nián","qīng","rén","","kě","yǐ","xiāng","xìn","","","yì","nián","yǐ","hòu","","nǎi","nai","hé","yé","ye","jié","hūn","le","","hòu","lái","yì","qǐ","lai","dào","le","xīn","xī","lán",""]},{"t":"p","zh":"我明白了：奶奶的爸爸不是不爱她。他只是怕她以后过得不好。","en":"I understood now: Grandma's father did love her. He was just afraid she wouldn't have a good life.","py":["wǒ","míng","bai","le","","nǎi","nai","de","bà","ba","bú","shì","bú","ài","tā","","tā","zhǐ","shì","pà","tā","yǐ","hòu","guò","de","bù","hǎo",""]}],"questions":[{"band":"A","q":"What happened on 12 May?","points":["It rained heavily; her father wouldn't let her go out; she cried by the window.","At 9 pm her father took an umbrella to the lake himself.","Hai was standing alone under the tree, soaking wet, still waiting since 4 pm, ready to return tomorrow.","Her father brought him home: 'This young man can be trusted.' They married a year later and moved to NZ."],"model":"It rained heavily and Grandma's father wouldn't let her out, so she cried by the window, sure Hai had left. But at nine o'clock her father went to the lake himself with an umbrella and found Hai alone under the tree, soaking wet and still waiting since four; he said he would come back tomorrow if she didn't come. Her father brought him home and said he could be trusted. They married a year later and moved to New Zealand."},{"band":"E","q":"Why does Grandma's father change his mind, and what does Ana learn from this?","points":["Hai's patience and commitment (waiting five hours in heavy rain, will return tomorrow) prove he is reliable — 'can be trusted'.","Her father went himself — implies he was already uncertain / softening.","Ana learns her great-grandfather wasn't unloving; he was afraid for his daughter's future — so Dad's opposition may also be fear, not lack of love."],"model":"Grandma's father changes his mind because Hai proves his character: he waited from four in the afternoon until nine at night in heavy rain and said he would come back the next day. That patience shows he is reliable, so the father says 'this young man can be trusted'. The fact that the father went to the lake himself suggests he was already beginning to doubt his own decision. Ana learns that her great-gra const MAXW = Math.max(...Object.keys(DICT).map(w => w.length));

function marks(t) {
  const m = new Array(t.length).fill(null);
  for (let i = 0; i < t.length;) {
    let hit = null;
    for (let L = Math.min(MAXW, t.length - i); L > 0; L--) { const w = t.substr(i, L); if (DICT[w]) { hit = DICT[w]; break; } }
    if (hit) { for (let j = 0; j < hit.zh.length; j++) m[i + j] = hit; i += hit.zh.length; } else i++;
  }
  return m;
}
function zhHTML(b) {
  const t = b.zh, m = marks(t), py = b.py || [];
  let h = '', i = 0;
  while (i < t.length) {
    const cur = m[i]; let j = i + 1;
    while (j < t.length && m[j] === cur && !(cur && m[j - 1] === cur && false)) j++;
    let inner = '';
    for (let k = i; k < j; k++) {
      const c = t[k] === '\n' ? '<br>' : esc(t[k]);
      inner += (S.py && py[k]) ? `<ruby>${c}<rt>${esc(py[k])}</rt></ruby>` : c;

    if (cur && cur.k === 'gl') h += `<span class="gl" title="${esc(cur.py + ' — ' + cur.en)}">${inner}</span>`;
    else if (cur && cur.k === 'fe' && S.fe) h += `<span class="fe" title="${esc(cur.en)}">${inner}</span>`;
    else h += inner;
    i = j;
  }
  return h;
}

        ${sh ? `<div class="guide"><b>Key points</b><ul>${q.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul><b>Model answer</b><div class="m">${esc(q.model)}</div></div>` : ''}</div>`;
    }).join('')}
    <div style="text-align:center;margin-top:14px"><button class="pill ${S.done[id] ? 'on' : ''}" data-done="${id}">${S.done[id] ? '✓ Chapter read' : 'Mark chapter as read'}</button>
    ${id < n ? `<button class="pill play" data-go="${id + 1}">Next chapter ›</button>` : `<button class="pill play" data-home>Back to contents</button>`}</div></div>`;
  document.getElementById('app').innerHTML = h;
  document.getElementById('bSpeed').textContent = S.speed + '×';
  updateBar();
}
function rerender() { const y = window.scrollY; renderChapter(view.ch.id); window.scrollTo(0, y); }
// ---- audio
function stop() { if (audio) { audio.pause(); audio = null; } playing = null; queue = null; document.querySelectorAll('.blk.now').forEach(e => e.classList.remove('now')); updateBar(); }
function playBlock(i, thenNext) {
  const ch = view.ch; if (!ch) return;
  const src = AU[`c${ch.id}-b${i}`]; if (!src) return;
  if (audio) audio.pause();
  document.querySelectorAll('.blk.now').forEach(e => e.classList.remove('now'));
  const el = document.querySelector(`.blk[data-i="${i}"]`); if (el) { el.classList.add('now'); if (thenNext) el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  audio = new Audio(src); audio.playbackRate = S.speed; playing = i;
  audio.onended = () => { if (queue !== null && i + 1 < ch.blocks.length) { setTimeout(() => { if (queue !== null) playBlock(i + 1, true); }, 450); } else stop(); };
  audio.play().catch(() => stop());
  updateBar();
}
function updateBar() {
  const b = document.getElementById('bPlay'); if (!b) return;
  b.textContent = queue !== null ? '⏹ Stop' : '▶ Play chapter';
  document.getElementById('nowT').textContent = playing !== null && view.ch ? `Playing ${playing + 1} / ${view.ch.blocks.length}` : '';
}
document.getElementById('bPlay').onclick = () => { if (queue !== null) stop(); else { queue = 0; playBlock(0, true); } };
document.getElementById('bSpeed').onclick = () => { const o = [0.8, 1, 1.2]; S.speed = o[(o.indexOf(S.speed) + 1) % o.length]; save(); document.getElementById('bSpeed').textContent = S.speed + '×'; if (audio) audio.playbackRate = S.speed; };
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-open],[data-go],[data-home],[data-tog],[data-guide],[data-done],.blk'); if (!t) return;
  if (t.dataset.open) renderChapter(+t.dataset.open), window.scrollTo(0, 0);
  else if (t.dataset.go) { renderChapter(+t.dataset.go); window.scrollTo(0, 0); }
  else if ('home' in t.dataset) renderHome();
  else if (t.dataset.tog) { S[t.dataset.tog] = !S[t.dataset.tog]; save(); rerender(); }
  else if (t.dataset.guide) { S.show[t.dataset.guide] = !S.show[t.dataset.guide]; save(); rerender(); }
  else if (t.dataset.done) { S.done[t.dataset.done] = !S.done[t.dataset.done]; save(); rerender(); }
  else if (t.classList.contains('blk')) { queue = null; playBlock(+t.dataset.i, false); }
});
document.addEventListener('keydown', ev => { const t = ev.target; if ((ev.key === 'Enter' || ev.key === ' ') && t.classList && t.classList.contains('blk')) { ev.preventDefault(); queue = null; playBlock(+t.dataset.i, false); } });
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.ans) { S.ans[t.dataset.ans] = t.value; save(); } });
document.getElementById('wtHeaderTitle').innerHTML = `<ruby>${esc(ST.title_zh)}<rt style="font-size:.42em;letter-spacing:.1em">${esc(ST.title_py)}</rt></ruby>`;
document.getElementById('wtHeaderZh').textContent = ST.title_en;
document.getElementById('wtHeaderSub').textContent = 'NCEA Chinese · Level ' + ST.level + ' Graded Reader · 分级读物';
const SEL = document.getElementById('chapterSelect');
SEL.innerHTML = '<option value="">Contents · 目录</option>' + ST.chapters.map(c => `<option value="${c.id}">${c.id}. ${esc(c.title_zh)} · ${esc(c.title_en)}</option>`).join('');
SEL.onchange = () => { if (SEL.value) renderChapter(+SEL.value); else renderHome(); window.scrollTo(0, 0); };
const _rc = renderChapter, _rh = renderHome;
renderChapter = function (id) { _rc(id); SEL.value = String(id); };
renderHome = function () { _rh(); SEL.value = ''; };
renderHome();
</script>
</body>
</html>
