<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶奶的情书 · Grandma's Love Letters</title>
<style>
/* Layout: a single reading column on letter paper; chapters as a contents list, letters as framed sheets. */
:root{
  --bg:#f2ede3; --paper:#fbf8f1; --sheet:#fffdf8; --ink:#2b2930; --muted:#716a6f; --line:#e1d8c8;
  --rose:#a8455a; --rose-soft:#f3e0e3; --sea:#3d6b7b; --sea-soft:#e2edf0; --gold:#9a7a3c; --feel:#fbe7c8; --feel-ink:#7a4e12;
  --navy:#1b3a4b; --ok:#2f7d4a;
  --zh:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --en:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161b;--paper:#1f1e24;--sheet:#25232a;--ink:#ece7e1;--muted:#a59fa6;--line:#38343d;--rose:#e08a9b;--rose-soft:#3b2830;--sea:#8cc0d0;--sea-soft:#22333a;--gold:#d5b46e;--feel:#4a3a1e;--feel-ink:#f3d6a2;--navy:#e8e8ed;--ok:#7cc796;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161b;--paper:#1f1e24;--sheet:#25232a;--ink:#ece7e1;--muted:#a59fa6;--line:#38343d;--rose:#e08a9b;--rose-soft:#3b2830;--sea:#8cc0d0;--sea-soft:#22333a;--gold:#d5b46e;--feel:#4a3a1e;--feel-ink:#f3d6a2;--navy:#e8e8ed;--ok:#7cc796;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--ui)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.zh{font-family:var(--zh)}
/* cover */
.cover{text-align:center;padding:34px 12px 22px}
.cover .py{color:var(--muted);letter-spacing:.12em;font-size:.85rem}
.cover h1{font-family:var(--zh);font-size:clamp(2.4rem,9vw,3.4rem);margin:4px 0 2px;color:var(--rose);font-weight:700;letter-spacing:.12em}
.cover .en{font-family:var(--en);font-style:italic;font-size:1.15rem;color:var(--ink)}
.cover .lvl{display:inline-block;margin-top:12px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sea);border:1px solid var(--sea);border-radius:999px;padding:3px 12px}
.blurb{font-family:var(--en);font-size:1rem;line-height:1.65;color:var(--muted);max-width:560px;margin:16px auto 0;text-align:center}
.how{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.86rem;color:var(--muted);margin:18px 0}
.how b{color:var(--ink)}
.toc{display:grid;gap:8px}
.toc button{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toc button:hover{border-color:var(--rose)}
.toc .n{font-family:var(--en);font-size:1.4rem;color:var(--rose);text-align:center}
.toc .t{font-family:var(--zh);font-size:1.1rem}.toc .s{font-size:.8rem;color:var(--muted)}
.toc .k{font-size:.72rem;color:var(--sea);white-space:nowrap}.toc .done{color:var(--gold);font-size:.8rem}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
/* chapter */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem}
.pill:disabled{opacity:.4;cursor:default}
.pill.on{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
.pill.play{background:var(--rose);border-color:var(--rose);color:var(--sheet);font-weight:600}
.chead{text-align:center;margin:14px 0 6px}
.chead .num{font-family:var(--en);font-style:italic;color:var(--rose)}
.chead h2{font-family:var(--zh);font-size:1.9rem;margin:2px 0;letter-spacing:.06em}
.chead .py{color:var(--muted);font-size:.85rem}.chead .en{font-family:var(--en);font-style:italic}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 16px}
.story{font-family:var(--zh);font-size:1.22rem;line-height:2.05}
.blk{border-radius:10px;padding:4px 8px;margin:2px -8px 8px;cursor:pointer;transition:background .15s}
.blk:hover{background:var(--rose-soft)}
.blk.now{background:var(--sea-soft)}
.blk .who{font-family:var(--ui);font-size:.72rem;color:var(--sea);letter-spacing:.06em;margin-right:6px;font-weight:700}
.blk .en{display:block;font-family:var(--en);font-size:.95rem;line-height:1.55;color:var(--muted);margin-top:2px}
.letter{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:22px 24px 18px 34px;position:relative;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.35)}
.letter::before{content:"";position:absolute;top:0;bottom:0;left:20px;border-left:1.5px solid var(--rose-soft)}
.letter .date{font-family:var(--ui);font-size:.78rem;color:var(--muted);text-align:right;margin-bottom:6px}
.letter .sign{text-align:right}
.letter .poem{text-align:center;font-style:italic;color:var(--rose);white-space:pre-line}
ruby{ruby-position:over}rt{font-family:var(--ui);font-size:.5em;color:var(--sea);letter-spacing:0}
.story.pyon{line-height:2.9}
.gl{border-bottom:2px dotted var(--rose)}
.fe{background:var(--feel);color:var(--feel-ink);border-radius:3px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:18px}
.box h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
.chips span b{font-family:var(--zh);font-size:1.05rem}
.chips i{font-style:normal;color:var(--muted)}
.q{margin-top:14px}
.q p{margin:0 0 6px;font-weight:600}
.q .band{font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;border:1px solid var(--line);color:var(--muted)}
.q .band.E{color:var(--gold);border-color:var(--gold)}.q .band.M{color:var(--accent,#3c7a8a)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical}
.guide{margin-top:8px;font-size:.9rem;border-left:3px solid var(--gold);padding:6px 12px;background:var(--sheet);border-radius:0 10px 10px 0}
.guide ul{margin:4px 0 8px;padding-left:18px}.guide .m{font-family:var(--en);line-height:1.55}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .now-t{font-size:.8rem;color:var(--muted);min-width:0}
.bar[hidden]{display:none}
/* practice: vocabulary + grammar */
.ex h4{font-size:1rem;margin:18px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex h4 .zh{font-size:1.05rem}
.ex .tag{background:var(--rose);color:var(--sheet);border-radius:6px;font-size:.72rem;padding:1px 7px;font-weight:800}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.ex select{font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--sheet);color:var(--ink);max-width:100%}
.mt{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(70px,120px) 1fr 22px;align-items:center;gap:8px}
.mrow b{font-size:1.2rem;font-weight:600}
.ok select{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.no select{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.tk{font-weight:800}.tk.ok{color:var(--ok)}.tk.no{color:var(--rose)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bank span{font-family:var(--zh);border:1px dashed var(--gold);border-radius:8px;padding:2px 10px;font-size:1.05rem}
.fl{font-family:var(--zh);font-size:1.12rem;line-height:2.2;margin:2px 0}
.fl select{font-family:var(--zh);font-size:1rem;padding:2px 6px}
.ckrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.score{font-size:.9rem;font-weight:700;color:var(--sea)}
.gp{border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin:12px 0;background:var(--sheet)}
.gp .gt{font-family:var(--zh);font-size:1.15rem;font-weight:700;color:var(--rose)}
.gp .pat{display:inline-block;background:var(--sea-soft);color:var(--sea);border-radius:6px;padding:2px 8px;font-size:.88rem;margin:4px 0;font-family:var(--zh)}
.gp .note{font-size:.92rem;margin:2px 0 6px}
.gp .eg{font-family:var(--zh);font-size:1.05rem;border-left:3px solid var(--rose-soft);padding-left:10px;margin:6px 0 4px}
.gp .eg small{display:block;font-family:var(--ui);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gp h5{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.ord{margin:8px 0 14px}
.ord .en{font-size:.88rem;color:var(--muted);font-style:italic;font-family:var(--en)}
.ord .line{min-height:46px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;align-items:center}
.ord .line:empty::before{content:"Tap the words below in the right order";font-size:.82rem;color:var(--muted)}
.ord .pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tile{font-family:var(--zh);font-size:1.08rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 11px;min-height:38px}
.line .tile{background:var(--rose-soft);border-color:var(--rose)}
.res{font-size:.92rem;margin-top:6px}.res.ok{color:var(--ok)}.res.no{color:var(--rose)}
.res .zh{font-size:1.05rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--rose);border-bottom-color:var(--rose);font-weight:700}
.tab .zh{font-size:1.02rem}
.listen{border-color:var(--sea);background:var(--sea-soft)}.listen h3{color:var(--sea)}
.lq{font-family:var(--en);font-size:1.02rem;margin:0 0 4px}
.notes{margin:0;padding-left:20px}.notes li{margin:4px 0}.notes b{font-size:1.08rem}
.wt{width:100%;border-collapse:collapse}.wt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wt td.zh{font-size:1.2rem;white-space:nowrap;width:1%}.wt .wpy{color:var(--sea);white-space:nowrap;width:1%}
.sec .sh{display:flex;align-items:center;gap:8px;font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:6px}
.sec .sh .zh{font-size:1.1rem;font-weight:700}
.sn{background:var(--navy);color:var(--sheet);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:800;flex-shrink:0}
.sq{margin:0 0 8px;padding-left:22px;font-size:1.05rem;line-height:1.8}
.wbox{min-height:110px;font-size:1.08rem;line-height:1.8}
.cnt{font-size:.82rem;color:var(--muted)}
.dnote{background:var(--sheet);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 8px 8px 0;font-size:.92rem;margin-bottom:6px}
.mq{margin:10px 0}.mq p{margin:0 0 6px}
.qt{font-size:.66rem;font-weight:800;color:var(--sea);border:1px solid var(--sea);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:2px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.picks.inl{display:flex;flex-wrap:wrap}
.pick{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.95rem;min-height:40px}
.pick b{color:var(--muted);font-size:.8rem}.pick .zh{font-size:1.02rem}
.pick.sel{border-color:var(--sea);background:var(--sea-soft)}.pick.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.pick.no{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose);background:var(--rose-soft)}.pick.ans{border-style:dashed;border-color:var(--ok)}
.next-tab{text-align:center;margin:18px 0 4px}
.tt p{margin:0 0 10px;text-indent:2em;line-height:2}
.exprbox{border-color:var(--gold);background:var(--sheet)}.exr{margin:6px 0}.exr b{font-size:1.15rem;color:var(--rose)}.exr .wpy{color:var(--sea);font-size:.85rem}.exr div{font-size:.9rem;color:var(--muted)}
/* Words That Think band, logo header and footer (as in the other apps) */
.top-bar{background:#0b1c26;color:#fff;padding:.6rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b1c26;z-index:11}
.top-bar .title{font-weight:700;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar select{padding:.4rem .6rem;border-radius:4px;border:none;font-size:.85rem;background:#fff;color:#0b1c26;cursor:pointer;max-width:200px}

.wt-header-text{min-width:0}
.wt-header-title{font-size:1.5rem;font-weight:700;color:var(--navy);line-height:1.25;font-family:var(--zh);letter-spacing:.08em}
.wt-header-zh{font-family:var(--en);font-style:italic;font-size:1.05rem;color:var(--ink);margin-top:.15rem}
.wt-header-sub{font-size:.9rem;color:var(--muted);margin-top:.35rem}
footer.wt-foot{text-align:center;margin-top:2rem;padding:1.4rem 0 1rem;border-top:1px solid var(--line)}
.wt-brand{font-family:"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1rem;color:var(--navy);letter-spacing:.4px;margin-bottom:.3rem}
.wt-brand .wt-sep{color:#e6a817;margin:0 .45rem}
.wt-underline{width:90px;height:3px;background:#e6a817;margin:.3rem auto .5rem}
.wt-credit{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.wtt-logo{width:96px;height:96px}.wt-header{gap:.8rem}.wt-header-title{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}
@media print{.bar,.tools,.nav,.pill,.top-bar,.wt-header{display:none!important}}
@media (max-width:480px){.mrow{grid-template-columns:1fr 22px}.mrow b{grid-column:1/-1}}

/* ===== Web skin v2: hero cover, card contents, chapter banner, floating player ===== */
:root{--deep:#1b3a4b;--mid:#2d6b73;--acc:#e6a817;--cink:#fff;--csub:rgba(255,255,255,.8);--navy:var(--deep);
  --card:var(--sheet);--shadow:0 1px 2px rgba(20,20,30,.06),0 8px 28px -12px rgba(20,20,30,.22);--radius:18px}
body{background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--mid) 16%,transparent),transparent 70%),var(--bg)}
.wt-header{display:none}
.top-bar{background:color-mix(in srgb,var(--deep) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);box-shadow:0 1px 0 rgba(255,255,255,.06),0 6px 20px -10px rgba(0,0,0,.4)}
.top-bar .title{font-weight:600;letter-spacing:.02em}
.top-bar select{border-radius:999px;padding:.4rem .9rem;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.top-bar select option{color:#111}
body::before{background:var(--deep)}
.wrap{max-width:880px}
/* hero */
.hero{position:relative;margin:6px calc(-1*max(16px,env(safe-area-inset-left,0px))) 18px;padding:34px 22px 30px;border-radius:0 0 28px 28px;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,var(--deep),color-mix(in srgb,var(--mid) 85%,var(--deep)))}
@media(min-width:760px){.hero{margin:18px 0 22px;border-radius:28px;padding:42px 40px}}
.hero::after{content:"";position:absolute;inset:auto -10% -60% 40%;height:120%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 38%,transparent),transparent);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:24px;align-items:center;justify-items:center;text-align:center}
@media(min-width:760px){.hero-in{grid-template-columns:240px 1fr;justify-items:start;text-align:left;gap:38px}}
.book3d{position:relative;width:min(220px,62vw);aspect-ratio:210/297;border-radius:6px 10px 10px 6px;overflow:hidden;transform:perspective(900px) rotateY(-12deg) rotateX(2deg);
  box-shadow:-2px 0 0 rgba(255,255,255,.25) inset,18px 22px 40px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);transition:transform .4s ease}
.book3d:hover{transform:perspective(900px) rotateY(-4deg)}
.book3d::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);z-index:2}
.book3d svg{position:absolute;inset:0;width:100%;height:100%}
.bk-t{position:absolute;inset:9% 8% auto;text-align:center;z-index:1;color:var(--cink)}
.bk-t .b1{font:600 .42rem var(--ui);letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.bk-t .b2{font-family:var(--zh);font-weight:700;font-size:clamp(1.3rem,6vw,1.7rem);letter-spacing:.14em;margin-top:8%;line-height:1.15}
.bk-t .b3{font:italic .6rem var(--en);margin-top:3%;color:var(--csub)}
.kicker{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
.h-zh{font-family:var(--zh);font-size:clamp(2.2rem,7vw,3.4rem);margin:8px 0 2px;letter-spacing:.12em;line-height:1.3;font-weight:700}
.h-zh rt{font:500 .3em var(--ui);letter-spacing:.2em;color:rgba(255,255,255,.75)}
.h-en{font:italic 1.2rem var(--en);color:rgba(255,255,255,.9)}
.h-tag{font:1rem/1.6 var(--en);color:rgba(255,255,255,.85);max-width:520px;margin:14px 0 0}
.h-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:inherit}
@media(max-width:759px){.h-stats,.h-cta{justify-content:center}}
.h-stats span{font-size:.78rem;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 11px}
.h-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn-main{background:var(--acc);color:#1b1b1b;border:0;border-radius:999px;padding:11px 22px;font-weight:700;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--acc) 70%,black);transition:transform .15s}
.btn-main:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 18px;font-weight:600}
.blurb{font-size:1.02rem;max-width:640px;margin:6px auto 18px}
.how{background:var(--card);border:0;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;position:relative;overflow:hidden}
.how::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--acc)}
.sect-h{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.sect-h b{font-family:var(--zh);font-size:1.35rem;color:var(--deep);letter-spacing:.1em}
.sect-h span{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-4px)}
/* contents as cards */
.toc{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.toc button.cc{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--card);border:0;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  position:relative;transition:transform .18s ease,box-shadow .18s ease;min-height:96px}
.toc button.cc:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,20,30,.08),0 16px 36px -14px rgba(20,20,30,.35)}
.cc .cn{flex-shrink:0;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 1.15rem var(--en);color:#fff;
  background:linear-gradient(140deg,var(--mid),var(--deep));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.cc .cb{min-width:0;flex:1}
.cc .ck{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);background:color-mix(in srgb,var(--mid) 12%,transparent);border-radius:999px;padding:2px 8px}
.cc .ct{display:block;font-family:var(--zh);font-size:1.2rem;margin-top:6px;color:var(--ink);line-height:1.35}
.cc .cs{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.cc .cd{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--ok);color:#fff}
.cc.test{background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card))}
.cc.test .cn{background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 60%,black))}
.box{background:var(--card);border:0;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.chips span{background:var(--bg);border-radius:10px;padding:4px 10px}
/* chapter banner */
.cband{position:relative;margin:4px 0 14px;border-radius:24px;overflow:hidden;min-height:170px;display:grid;place-items:center;text-align:center;color:#fff;box-shadow:var(--shadow);background:var(--deep)}
.cband .art{position:absolute;inset:0}.cband .art svg{width:100%;height:100%}
.cband .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 25%,transparent),color-mix(in srgb,var(--deep) 78%,transparent))}
.cband .in{position:relative;padding:22px 18px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.cband .num{font:600 .72rem var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.cband h2{font-family:var(--zh);font-size:clamp(1.7rem,5vw,2.3rem);margin:6px 0 2px;letter-spacing:.08em;color:#fff}
.cband .py{font-size:.82rem;letter-spacing:.1em;color:rgba(255,255,255,.8)}.cband .en{font:italic 1.02rem var(--en);color:rgba(255,255,255,.92)}
.nav .pill{background:var(--card);border:0;box-shadow:var(--shadow)}
/* segmented tabs */
.tabs{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:4;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:0;padding:6px;border-radius:999px;box-shadow:var(--shadow);gap:4px;margin:14px 0 16px}
.tab{border:0;border-radius:999px;padding:8px 14px;color:var(--muted);transition:background .15s,color .15s}
.tab.on{background:linear-gradient(140deg,var(--mid),var(--deep));color:#fff;border:0}
.tab:not(.on):hover{background:color-mix(in srgb,var(--mid) 10%,transparent)}
.pill{border-radius:999px;transition:transform .12s,box-shadow .12s}
.pill.play{background:linear-gradient(140deg,var(--mid),var(--deep));border-color:transparent;color:#fff}
.pill.on{background:color-mix(in srgb,var(--mid) 14%,var(--card));border-color:var(--mid);color:var(--mid)}
.pill:not(:disabled):hover{transform:translateY(-1px)}
.story .blk{border-radius:12px}
.blk.now{background:color-mix(in srgb,var(--acc) 22%,transparent);box-shadow:inset 3px 0 0 var(--acc)}
.letter{border:0;border-radius:6px;box-shadow:var(--shadow)}
.listen{background:linear-gradient(140deg,color-mix(in srgb,var(--mid) 14%,var(--card)),var(--card))}
/* floating player */
.bar{left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));border:0;border-radius:999px;padding:8px 10px 8px 8px;
  background:color-mix(in srgb,var(--deep) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 34px -12px rgba(0,0,0,.55);flex-wrap:nowrap;justify-content:flex-start}
.bar .pill{background:rgba(255,255,255,.12);color:#fff;border:0}.bar .pill.play{background:var(--acc);color:#1b1b1b}
.bar .now-t{color:rgba(255,255,255,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer.wt-foot{border-top:0}
@media(prefers-reduced-motion:reduce){.book3d,.toc button.cc,.btn-main,.pill{transition:none}.book3d{transform:none}}
@media print{.hero,.cband .art{display:none}}

"Yue,","py":["yuè",""]},{"t":"letter","who":"爷爷","zh":"对不起，我给你写这封信。","en":"I'm sorry to write you this letter.","py":["duì","bu","qǐ","","wǒ","gěi","nǐ","xiě","zhè","fēng","xìn",""]},{"t":"letter","who":"爷爷","zh":"我是每天给你家送信的邮差。每天下午四点，我都看到你坐在湖边的大树下面看书。你看书的时候很安静，很好看。","en":"I'm the postman who delivers letters to your house every day. Every afternoon at four, I see you sitting under the big tree by the lake, reading. When you read, you are so calm, so lovely.","py":["wǒ","shì","měi","tiān","gěi","nǐ","jiā","sòng","xìn","de","yóu","chāi","","měi","tiān","xià","wǔ","sì","diǎn","","wǒ","dōu","kàn","dào","nǐ","zuò","zài","hú","biān","de","dà","shù","xià","miàn","kàn","shū","","nǐ","kàn","shū","de","shí","hou","hěn","ān","jìng","","hěn","hǎo","kàn",""]},{"t":"letter","who":"爷爷","zh":"我知道，我只是一个邮差，我家也没有钱。可是我每天最期待的，就是下午四点走到你家门口。","en":"I know I'm only a postman, and my family has no money. But what I look forward to most every day is walking to your door at four in the afternoon.","py":["wǒ","zhī","dao","","wǒ","zhǐ","shì","yí","gè","yóu","chāi","","wǒ","jiā","yě","méi","yǒu","qián","","kě","shì","wǒ","měi","tiān","zuì","qī","dài","de","","jiù","shì","xià","wǔ","sì","diǎn","zǒu","dào","nǐ","jiā","mén","kǒu",""]},{"t":"letter","who":"爷爷","zh":"这个星期天下午，我会在湖边的大树下面等你。如果你不来，我不会生气，我还是会每天给你家送信。","en":"This Sunday afternoon I will wait for you under the big tree by the lake. If you don't come, I won't be angry — I'll still deliver letters to your house every day.","py":["zhè","ge","xīng","qī","tiān","xià","wǔ","","wǒ","huì","zài","hú","biān","de","dà","shù","xià","miàn","děng","nǐ","","rú","guǒ","nǐ","bù","lái","","wǒ","bú","huì","shēng","qì","","wǒ","hái","shì","huì","měi","tiān","gěi","nǐ","jiā","sòng","xìn",""]},{"t":"sign","who":"爷爷","zh":"海","en":"Hai","py":["hǎi"]}],"questions":[{"band":"A","q":"Who is the writer, and what does he ask Yue to do?","points":["Hai, the postman who delivers letters to her house every day.","He sees her reading under the big tree by the lake at 4 pm every day.","He asks her to meet him under the tree by the lake on Sunday afternoon."],"model":"The writer is Hai, the postman who delivers letters to Yue's house every day. He has seen her reading under the big tree by the lake every afternoon at four, and he asks her to meet him there on Sunday afternoon."},{"band":"E","q":"What kind of person is Hai? Use evidence from the letter to support your answer.","points":["Shy and polite: he begins by apologising for writing.","Honest and humble: admits he is only a postman with no money.","Sincere: the 4 pm walk to her door is what he looks forward to most.","Respectful, not pushy: if she doesn't come he won't be angry and will still deliver letters."],"model":"Hai is shy, honest and respectful. He begins by apologising for writing at all, which shows he is polite and a little nervous. He is honest about his situation — he admits he is only a postman and his family has no money — rather than trying to impress her. His feelings are sincere: walking to her door at four o'clock is the moment he looks forward to most each day. Most importantly, he respects her choice: if she doesn't come he won't be angry, and he will still deliver her letters, so he puts no pressure on her."}],"title_py":"hú biān de dà shù","exercises":{"match":[{"zh":"邮差","en":"postman"},{"zh":"送信","en":"to deliver letters"},{"zh":"安静","en":"quiet, calm"},{"zh":"期待","en":"to look forward to"},{"zh":"门口","en":"doorway, gate"},{"zh":"生气","en":"angry"}],"opts":[3,2,5,0,1,4],"bank":["只是","等","安静","期待","生气","送"],"fill":[{"s":"图书馆里很＿＿，大家都在看书。","a":"安静"},{"s":"我非常＿＿这个周末的旅行。","a":"期待"},{"s":"你不来，我也不会＿＿。","a":"生气"},{"s":"邮差每天给我们家＿＿信。","a":"送"},{"s":"我会在大树下面＿＿你。","a":"等"}],"grammar":[{"t":"只是 (just, only)","p":"只是 + noun / verb","note":"只是 makes something sound small or simple: “just / only”. It often explains or apologises.","eg":"我知道，我只是一个邮差，我家也没有钱。","order":[{"w":["钱","没有","学生","只是","很多","一个","他"],"s":"他只是一个学生，没有很多钱。","en":"He's just a student and doesn't have much money.","alt":[]},{"w":["我","只是","说说话","想","和","你"],"s":"我只是想和你说说话。","en":"I just want to talk with you.","alt":[]}],"make":[{"q":"Say: “It’s not a big problem, it’s just a small thing.”","a":"这不是大问题，只是一件小事情。"}]},{"t":"如果 …，还是会 …","p":"如果 + condition，(subject) + 还是会 + verb","note":"还是会 = “will still …”: the result does not change, whatever happens.","eg":"如果你不来，我不会生气，我还是会每天给你家送信。","order":[{"w":["还是","下雨","明天","我","去","会","学校","如果"],"s":"如果明天下雨，我还是会去学校。","en":"If it rains tomorrow, I will still go to school.","alt":[]},{"w":["不","你","等","会","你","来","如果","我","还是"],"s":"如果你不来，我还是会等你。","en":"If you don't come, I will still wait for you.","alt":[]}],"make":[{"q":"Say: “If you are busy, I will still come to see you.”","a":"如果你很忙，我还是会来看你。"}]}]},"lesson":{"listen":{"q":"Who wrote the letter, and what does he ask?","a":"The postman (Grandpa, Hai), who delivers letters to her house; he asks her to meet him under the big tree by the lake on Sunday afternoon."},"words":[{"zh":"树","py":"shù","en":"tree"},{"zh":"安静","py":"ānjìng","en":"quiet"},{"zh":"期待","py":"qīdài","en":"to expect"},{"zh":"还","py":"huán","en":"still (还在等); also"}],"notes":[{"zh":"对不起，我给你写这封信","en":"sorry to write you this letter — a shy, polite opening"},{"zh":"我只是一个邮差","en":"I'm only a postman"},{"zh":"我每天最期待的，就是……","en":"what I look forward to most every day is …"},{"zh":"我还是会每天给你家送信","en":"I will still deliver letters to your home every day"}],"summary":{"qs":["写信的人是谁？","他每天下午四点看到了什么？","他觉得自己有什么问题？","他每天最期待什么？","他请月星期天做什么？","如果月不来，他会怎么样？"],"limit":100,"model":"写信的人是每天给月家送信的邮差。每天下午四点，他都看到月在湖边的大树下面看书。他知道自己只是一个邮差，家里也没有钱。他每天最期待的，就是走到她家门口。他请月星期天下午去湖边的大树下面见面。如果她不来，他也不会生气。"},"diff":{"t":"想 / 想念 / 想家","note":"想 = think / want to / miss. 想念 = to miss (more formal, written). 想家 = to be homesick.","items":[{"s":"我在新西兰很＿＿，我想回台湾。 (homesick)","opts":["想","想念","想家"],"a":"想家"},{"s":"我很＿＿你。 (miss — written, in a letter)","opts":["想","想念","想家"],"a":"想念"},{"s":"我＿＿请你星期天来湖边。 (would like to)","opts":["想","想念","想家"],"a":"想"},{"s":"你＿＿：他为什么写信？ (think)","opts":["想","想念","想家"],"a":"想"}]},"mcq":[{"type":"理解","q":"邮差每天几点看到月？","opts":["上午十点","中午十二点","下午四点","晚上七点"],"a":2},{"type":"理解","q":"月在湖边做什么？","opts":["照相","唱歌","看书","写信"],"a":2},{"type":"理解","q":"邮差为什么说“我只是一个邮差”？","opts":["他想当老师","他不喜欢工作","他觉得自己没有钱，不够好","他很忙"],"a":2},{"type":"理解","q":"他们在哪里见面？","opts":["湖边的大树下面","码头","学校","月的家"],"a":0},{"type":"语法","q":"我每天最期待的，＿＿是下午四点走到你家门口。","opts":["才","就","都","也"],"a":1},{"type":"语法","q":"如果你不来，我＿＿会每天给你家送信。","opts":["所以","或者","还是","可是"],"a":2},{"type":"词汇","q":"“安静”的意思是：","opts":["clean","happy","quiet, calm","safe"],"a":2},{"type":"词汇","q":"“期待”的意思是：","opts":["to be late","to remember","to look forward to","to wait in line"],"a":2}],"write":{"en":"Write a short, polite letter or message inviting someone you admire to meet you: why you are writing, where and when.","zh":"写一封短信，请一个你喜欢的人和你见面：你为什么写信？在哪里见面？什么时候？","n":"80–100","model":"小云：对不起，我给你发这个短信。我是你们班旁边的Tom。每天中午，我都看到你在图书馆看中文书，你看书的时候很安静。这个星期五下午三点半，我会在学校门口的大树下面等你，我想和你一起去喝茶。如果你不来，也没有关系。"}}},{"id":3,"kind":"now","title_zh":"奶奶的故事","title_en":"Grandma's story","blocks":[{"t":"p","zh":"晚上，我带了那封信去找奶奶。","en":"In the evening I took that letter and went to find Grandma.","py":["wǎn","shang","","wǒ","dài","le","nà","fēng","xìn","qù","zhǎo","nǎi","nai",""]},{"t":"say","who":"安娜","zh":"“奶奶，那个星期天，你去湖边了吗？”","en":"\"Grandma, that Sunday — did you go to the lake?\"","py":["","nǎi","nai","","nà","ge","xīng","qī","tiān","","nǐ","qù","hú","biān","le","ma","",""]},{"t":"say","who":"奶奶","zh":"“去了。我穿了一件白色的裙子。可是我太不好意思了，一直没有说话。”","en":"\"I did. I wore a white dress. But I was so shy that I didn't say a word the whole time.\"","py":["","qù","le","","wǒ","chuān","le","yí","jiàn","bái","sè","de","qún","zi","","kě","shì","wǒ","tài","bù","hǎo","yì","si","le","","yì","zhí","méi","yǒu","shuō","huà","",""]},{"t":"p","zh":"奶奶笑了。她说，那天下午，他们在湖边坐了很久，看湖水，听鸟唱歌。后来，他们每个星期天都在湖边见面。爷爷很会讲故事，常常讲他家乡的山和海。","en":"Grandma laughed. She said that afternoon they sat by the lake for a long time, looking at the water and listening to the birds sing. After that, they met by the lake every Sunday. Grandpa was a great storyteller and often talked about the mountains and sea of his hometown.","py":["nǎi","nai","xiào","le","","tā","shuō","","nà","tiān","xià","wǔ","","tā","men","zài","hú","biān","zuò","le","hěn","jiǔ","","kàn","hú","shuǐ","","tīng","niǎo","chàng","gē","","hòu","lái","","tā","men","měi","gè","xīng","qī","tiān","dōu","zài","hú","biān","jiàn","miàn","","yé","ye","hěn","huì","jiǎng","gù","shì","","cháng","cháng","jiǎng","tā","jiā","xiāng","de","shān","hé","hǎi",""]},{"t":"say","who":"安娜","zh":"“你的爸爸妈妈知道吗？”","en":"\"Did your parents know?\"","py":["","nǐ","de","bà","ba","mā","ma","zhī","dao","ma","",""]},{"t":"p","zh":"奶奶不笑了。","en":"Grandma stopped smiling.","py":["nǎi","nai","bú","xiào","le",""]},{"t":"say","who":"奶奶","zh":"“知道了以后，我爸爸非常生气。他说：‘他只是一个邮差，他不能给你好的生活！’从那天开始，我爸爸不让我再去湖边。”","en":"\"When they found out, my father was furious. He said, 'He's only a postman — he can't give you a good life!' From that day on, my father wouldn't let me go to the lake again.\"","py":["","zhī","dao","le","yǐ","hòu","","wǒ","bà","ba","fēi","cháng","shēng","qì","","tā","shuō","","","tā","zhǐ","shì","yí","gè","yóu","chāi","","tā","bù","néng","gěi","nǐ","hǎo","de","shēng","huó","","","cóng","nà","tiān","kāi","shǐ","","wǒ","bà","ba","bú","ràng","wǒ","zài","qù","hú","biān","",""]},{"t":"p","zh":"我又想到爸爸在车上说的话。原来，奶奶也有一个不同意她的爸爸。我觉得，我和奶奶同样不容易。","en":"I thought again of what Dad had said in the car. So Grandma had a father who didn't approve of her, too. I felt that Grandma and I had the same struggle.","py":["wǒ","yòu","xiǎng","dào","bà","ba","zài","chē","shàng","shuō","de","huà","","yuán","lái","","nǎi","nai","yě","yǒu","yí","gè","bù","tóng","yì","tā","de","bà","ba","","wǒ","jué","de","","wǒ","hé","nǎi","nai","tóng","yàng","bù","róng","yì",""]}],"questions":[{"band":"A","q":"What happened at the lake, and what happened when Grandma's parents found out?","points":["Grandma went, wearing a white dress, but was too shy to speak.","They sat by the lake a long time, looking at the water and listening to birds; then met every Sunday.","Her father was furious: 'He's only a postman — he can't give you a good life'; he stopped her going to the lake."],"model":"Grandma went to the lake in a white dress but was too shy to say anything. They sat together for a long time, looking at the water and listening to the birds, and after that they met there every Sunday. When her parents found out, her father was furious, said a postman couldn't give her a good life, and banned her from going to the lake."},{"band":"E","q":"What connection does Ana make between Grandma's story and her own life? Explain.","points":["She remembers Dad's words in the car (about studying maths, not photography).","原来 shows a discovery: Grandma also had a father who opposed what she wanted.","Implied: Ana begins to see her conflict as part of a family pattern — parents opposing children's choices — and to feel less alone."],"model":"Ana thinks again of Dad's words in the car, when he told her to stop taking photos and study maths. The word 原来 ('so it turns out') shows a discovery: Grandma also had a father who disapproved of what she wanted. Ana realises her conflict with Dad isn't unique — it echoes something that happened in her own family two generations earlier — which makes her feel less alone and prepares her to see Dad's position differently later."}],"title_py":"nǎi nai de gù shì","exercises":{"match":[{"zh":"裙子","en":"skirt, dress"},{"zh":"不好意思","en":"shy, embarrassed"},{"zh":"鸟","en":"bird"},{"zh":"后来","en":"later, afterwards"},{"zh":"同意","en":"to agree"},{"zh":"原来","en":"so it turns out"}],"opts":[1,3,2,4,5,0],"bank":["同意","见面","后来","原来","一直","裙子"],"fill":[{"s":"她穿了一件很漂亮的＿＿。","a":"裙子"},{"s":"我们是在学校认识的，＿＿每天都一起吃午饭。","a":"后来"},{"s":"爸爸不＿＿我晚上一个人出去。","a":"同意"},{"s":"＿＿他是你哥哥！","a":"原来"},{"s":"那天她很不好意思，＿＿没有说话。","a":"一直"}],"grammar":[{"t":"让 / 不让 (let, make)","p":"person + 让 / 不让 +
